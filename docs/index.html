   '1/12 הוא <bdi dir="ltr">3/36</bdi>: סופרים את (3,4) ו־(4,3) כתוצאה אחת, אבל מחלקים ב־36 זוגות סדורים. צריך לספור את שני הסדרים: 6 תוצאות.',
   '7/36 מתקבל אם סופרים 7 תוצאות טובות, כנראה כי הסכום הוא 7. בפועל יש רק 6 זוגות שסכומם 7.',
   '1/36 היא ההסתברות לתוצאה אחת מסוימת, למשל <bdi dir="ltr">(3,4)</bdi>. יש 6 תוצאות שנותנות 7.']}
],
s3:[
{q:'נתון: E(X) = 4, V(X) = 9. מגדירים Y = 3 − 2X. מהן התוחלת והשונות של Y?', o:['E(Y) = −5, V(Y) = 36','E(Y) = −5, V(Y) = −18','E(Y) = 11, V(Y) = 36','E(Y) = −5, V(Y) = 18'],
 e:SOL({ask:'התוחלת והשונות של טרנספורמציה לינארית <bdi dir="ltr">Y = a + bX</bdi>, עם <bdi dir="ltr">a = 3</bdi> ו־<bdi dir="ltr">b = −2</bdi>.',
   f:'<bdi dir="ltr">E(a + bX) = a + b·E(X) ; V(a + bX) = b²·V(X)</bdi>',
   why:'התוחלת זזה בדיוק כמו כל תצפית. השונות מודדת מרחקים בריבוע: הקבוע a לא משנה מרחקים, והכפלה ב־b מכפילה כל מרחק ב־b, ולכן את הריבוע ב־b².',
   steps:['תוחלת: <bdi dir="ltr">E(Y) = 3 − 2·4 = −5</bdi>', 'שונות: <bdi dir="ltr">V(Y) = (−2)²·9 = 4·9 = 36</bdi>'],
   res:'<bdi dir="ltr">E(Y) = −5</bdi>, <bdi dir="ltr">V(Y) = 36</bdi>.',
   tip:'בשונות b עולה בריבוע, ולכן הסימן שלו נעלם. שונות לעולם אינה שלילית.'}),
 w:[null,
   'השונות ‎−18 מתקבלת מכפל ב־b במקום ב־b²: <bdi dir="ltr">−2·9</bdi>. שונות לא יכולה להיות שלילית. צריך <bdi dir="ltr">(−2)²·9 = 36</bdi>.',
   'התוחלת 11 מתקבלת מ־<bdi dir="ltr">3 + 2·4</bdi>, כלומר בלי הסימן של b. הנוסחה היא <bdi dir="ltr">3 − 2·4 = −5</bdi>.',
   'השונות 18 מתקבלת מכפל ב־<bdi dir="ltr">|b| = 2</bdi> במקום ב־<bdi dir="ltr">b² = 4</bdi>. הכפל ב־|b| מתאים לסטיית התקן, לא לשונות.']},
{q:'נתון: V(X) = 4, V(Y) = 9, Cov(X,Y) = −3. מהי השונות של X + Y?', o:['7','13','19','10'],
 e:SOL({ask:'השונות של סכום של שני משתנים שקשורים זה לזה (יש ביניהם שונות משותפת).',
   f:'<bdi dir="ltr">V(X+Y) = V(X) + V(Y) + 2·Cov(X,Y)</bdi>',
   why:'הפיזור של סכום תלוי לא רק בפיזור של כל משתנה, אלא גם בשאלה אם הם "זזים יחד". Cov שלילי אומר שכשאחד עולה השני נוטה לרדת, ולכן הם מקזזים זה את זה.',
   steps:['מציבים: <bdi dir="ltr">V(X+Y) = 4 + 9 + 2·(−3)</bdi>', 'מחשבים: <bdi dir="ltr">13 − 6 = 7</bdi>'],
   res:'השונות של X + Y היא 7.',
   tip:'השונות המשותפת נכנסת פעמיים (2·Cov), ועם הסימן שלה.'}),
 w:[null,
   '13 הוא 4 + 9 בלבד, בלי השונות המשותפת. זה נכון רק כשהמשתנים בלתי תלויים (Cov = 0).',
   '19 מתקבל אם מוסיפים 2·3 במקום להחסיר. ה־Cov כאן שלילי, ולכן מחסירים.',
   '10 מתקבל אם מכפילים את Cov פעם אחת בלבד (4 + 9 − 3). בנוסחה הוא מופיע פעמיים: 2·Cov.']},
{q:'המשתנה X מתפלג בינומית עם n = 10 ו־p = 0.3. מהן התוחלת והשונות של X?', o:['3 ו־2.1','3 ו־0.21','7 ו־2.1','3 ו־3'],
 e:SOL({ask:'התוחלת והשונות של מספר ההצלחות ב־10 ניסויים בלתי תלויים, עם סיכוי הצלחה 0.3 בכל ניסוי.',
   f:'<bdi dir="ltr">E(X) = n·p ; V(X) = n·p·(1 − p)</bdi>',
   why:'בכל ניסוי מצפים ל־p הצלחות, ולכן ב־n ניסויים ל־n·p. השונות של ניסוי בודד היא <bdi dir="ltr">p(1 − p)</bdi>, ובגלל אי־התלות השונויות מצטברות.',
   steps:['תוחלת: <bdi dir="ltr">10·0.3 = 3</bdi>', 'שונות: <bdi dir="ltr">10·0.3·0.7 = 2.1</bdi>'],
   res:'התוחלת 3 והשונות 2.1.',
   tip:'בבינומית השונות תמיד קטנה מהתוחלת, כי כופלים בגורם <bdi dir="ltr">1 − p</bdi>, שקטן מ־1.'}),
 w:[null,
   '0.21 הוא <bdi dir="ltr">0.3·0.7</bdi>, השונות של ניסוי בודד. שכחו לכפול במספר הניסויים: <bdi dir="ltr">10·0.21 = 2.1</bdi>.',
   '7 הוא <bdi dir="ltr">10·0.7</bdi>, התוחלת של מספר הכישלונות. התוחלת של מספר ההצלחות היא <bdi dir="ltr">10·0.3 = 3</bdi>.',
   'שונות ששווה לתוחלת מאפיינת התפלגות פואסון, לא בינומית. בבינומית כופלים עוד ב־<bdi dir="ltr">1 − p = 0.7</bdi>: <bdi dir="ltr">3·0.7 = 2.1</bdi>.']},
{q:'מקדם המתאם בין X ל־Y הוא 0. מה ניתן להסיק?', o:['אין ביניהם קשר לינארי','הם בהכרח בלתי תלויים','V(X+Y) = 0','אחד מהם קבוע'],
 e:SOL({ask:'מה בדיוק אומר מקדם מתאם 0, ומה הוא לא אומר.',
   why:'מקדם המתאם מודד רק את החוזק של קשר בצורת קו ישר. משתנים יכולים להיות תלויים חזק בקשר עקום, ועדיין לקבל מתאם 0.',
   steps:['מתאם 0 פירושו <bdi dir="ltr">Cov(X,Y) = 0</bdi>: אין מגמה לינארית.', 'דוגמה: אם <bdi dir="ltr">Y = X²</bdi> ו־X סימטרי סביב 0, המתאם 0, אבל Y נקבע לגמרי לפי X.'],
   res:'אפשר להסיק רק שאין ביניהם קשר לינארי.',
   tip:'אי־תלות גוררת מתאם 0, אבל מתאם 0 לא גורר אי־תלות.'}),
 w:[null,
   'אי־תלות גוררת מתאם 0, אבל לא להפך. ייתכן קשר לא לינארי חזק (למשל <bdi dir="ltr">Y = X²</bdi>) עם מתאם 0.',
   'מתאם 0 פירושו שהשונות המשותפת 0, ולכן <bdi dir="ltr">V(X+Y) = V(X) + V(Y)</bdi>. זה לא 0, אלא סכום השונויות.',
   'משתנה קבוע אכן נותן Cov של 0, אבל אי אפשר להסיק את זה ממתאם 0. רוב המקרים של מתאם 0 הם שני משתנים אמיתיים בלי קשר לינארי.']},
{q:'נתון: E(X) = 4, E(X²) = 20. מהי סטיית התקן של X?', o:['2','4','16','√20'],
 e:SOL({ask:'סטיית התקן של X, כשנתונים התוחלת ותוחלת הריבוע.',
   f:'<bdi dir="ltr">V(X) = E(X²) − [E(X)]² ; σ = √V(X)</bdi>',
   why:'זו הנוסחה המקוצרת לשונות: ממוצע הריבועים פחות ריבוע הממוצע. אחרי שיש שונות, סטיית התקן היא השורש שלה.',
   steps:['ריבוע התוחלת: <bdi dir="ltr">4² = 16</bdi>', 'שונות: <bdi dir="ltr">20 − 16 = 4</bdi>', 'סטיית תקן: <bdi dir="ltr">√4 = 2</bdi>'],
   res:'סטיית התקן של X היא 2.',
   tip:'אל תשכחו את הצעד האחרון: שואלים על סטיית התקן, ולכן מוציאים שורש מהשונות.'}),
 w:[null,
   '4 היא השונות. סטיית התקן היא השורש שלה: <bdi dir="ltr">√4 = 2</bdi>.',
   '16 הוא <bdi dir="ltr">[E(X)]²</bdi>, האיבר שמחסירים. השונות היא <bdi dir="ltr">20 − 16 = 4</bdi>, וסטיית התקן 2.',
   '√20 מתקבל אם מוציאים שורש מ־<bdi dir="ltr">E(X²)</bdi> בלי להחסיר את ריבוע התוחלת. צריך <bdi dir="ltr">√(20 − 16) = 2</bdi>.']},
{q:'מטילים מטבע הוגן 4 פעמים. מה ההסתברות לקבל בדיוק 2 פעמים "עץ"?', o:['0.375','0.25','0.5','0.0625'],
 e:SOL({ask:'הסתברות למספר מסוים של הצלחות בסדרת ניסויים בלתי תלויים: התפלגות בינומית.',
   f:'<bdi dir="ltr">P(X = k) = C(n,k)·p<sup>k</sup>·(1 − p)<sup>n−k</sup></bdi>',
   why:'כל סדרה מסוימת עם 2 "עץ" ו־2 "פלי" מקבלת הסתברות <bdi dir="ltr">0.5⁴</bdi>. צריך לכפול במספר הסדרות האפשריות, כלומר במספר הדרכים לבחור באילו 2 הטלות יצא "עץ".',
   steps:['סדרה מסוימת: <bdi dir="ltr">0.5²·0.5² = 1/16 = 0.0625</bdi>', 'מספר הסדרות: <bdi dir="ltr">C(4,2) = 6</bdi>', 'יחד: <bdi dir="ltr">6·0.0625 = 0.375</bdi>'],
   res:'ההסתברות היא 0.375.',
   tip:'בבינומית לא לשכוח את המקדם <bdi dir="ltr">C(n,k)</bdi>: הוא סופר את כל הסדרים.'}),
 w:[null,
   '0.25 הוא <bdi dir="ltr">0.5²</bdi>, ההסתברות לשני "עץ" בשתי הטלות בלבד. יש 4 הטלות, ושתי האחרות צריכות לצאת "פלי", ויש 6 סדרים אפשריים.',
   '0.5 מתקבל מהאינטואיציה ש־2 עץ (חצי מההטלות) הוא "הצפוי". 2 אכן התוחלת, אבל ההסתברות לקבל בדיוק 2 היא רק <bdi dir="ltr">6/16 = 0.375</bdi>.',
   '0.0625 היא ההסתברות לסדרה אחת מסוימת (למשל עץ, עץ, פלי, פלי). שכחו לכפול ב־<bdi dir="ltr">C(4,2) = 6</bdi> הסדרים.']}
],
s4:[
{q:'X מתפלג נורמלית. איזה אחוז מהתצפיות נמצא, בקירוב, במרחק של עד שתי סטיות תקן מהממוצע?', o:['95%','68%','99.7%','90%'],
 e:SOL({ask:'כמה מהשטח מתחת לעקומה הנורמלית נמצא בין <bdi dir="ltr">μ − 2σ</bdi> ל־<bdi dir="ltr">μ + 2σ</bdi>.',
   f:'<bdi dir="ltr">P(|Z| ≤ 2) = 2·Φ(2) − 1</bdi>',
   why:'בהתפלגות נורמלית האחוזים תלויים רק במספר סטיות התקן מהממוצע. כלל 68-95-99.7 מסכם את שלושת המרחקים השכיחים: 1, 2 ו־3 סטיות תקן.',
   steps:['מהטבלה: <bdi dir="ltr">Φ(2) = 0.9772</bdi>', '<bdi dir="ltr">2·0.9772 − 1 = 0.9544</bdi>, כלומר כ־95%'],
   res:'כ־95% מהתצפיות.',
   tip:'בדיוק 95% מתקבל ב־1.96 סטיות תקן. זה הערך שמשמש ברווח סמך של 95%.'}),
 w:[null,
   '68% הוא האחוז בטווח של סטיית תקן <u>אחת</u> מהממוצע. בשתי סטיות תקן הטווח רחב יותר: כ־95%.',
   '99.7% הוא האחוז בטווח של <u>שלוש</u> סטיות תקן. בשתיים: כ־95%.',
   '90% מתקבל בטווח של כ־1.645 סטיות תקן בכל צד. בשתי סטיות תקן האחוז גבוה יותר: כ־95%.']},
{q:'נתון X ~ N(100, 15²). מה ההסתברות ש־X יהיה גדול מ־130?', o:['0.0228','0.9772','0.0456','0.1587'],
 e:SOL({ask:'השטח בזנב הימני של התפלגות נורמלית, מעל 130.',
   f:'<bdi dir="ltr">Z = (X − μ)/σ ; P(X > x) = 1 − Φ(z)</bdi>',
   why:'כדי להשתמש בטבלה מתרגמים את 130 לציון תקן: כמה סטיות תקן הוא מעל הממוצע. הטבלה נותנת את השטח <u>משמאל</u>, ולכן לזנב הימני מחסירים מ־1.',
   steps:['ציון תקן: <bdi dir="ltr">Z = (130 − 100)/15 = 2</bdi>', 'מהטבלה: <bdi dir="ltr">Φ(2) = 0.9772</bdi>', 'הזנב הימני: <bdi dir="ltr">1 − 0.9772 = 0.0228</bdi>'],
   res:'ההסתברות היא 0.0228.',
   tip:'"גדול מ־" = <bdi dir="ltr">1 − Φ</bdi>. בנתון <bdi dir="ltr">N(100, 15²)</bdi> המספר השני הוא השונות, וסטיית התקן היא 15.'}),
 w:[null,
   '0.9772 הוא <bdi dir="ltr">Φ(2)</bdi>, ההסתברות להיות <u>מתחת</u> ל־130. שואלים על "גדול מ־", ולכן <bdi dir="ltr">1 − 0.9772 = 0.0228</bdi>.',
   '0.0456 הוא שטח שני הזנבות יחד (<bdi dir="ltr">2·0.0228</bdi>), כלומר מעל 130 <u>או</u> מתחת ל־70. שואלים רק על הזנב העליון.',
   '0.1587 הוא <bdi dir="ltr">1 − Φ(1)</bdi>, כלומר זנב מעל סטיית תקן אחת. 130 נמצא <bdi dir="ltr">30/15 = 2</bdi> סטיות תקן מעל הממוצע, ולא אחת.']},
{q:'איזו טענה נכונה לגבי ההתפלגות הנורמלית?', o:['הממוצע, החציון והשכיח שווים','הממוצע גדול מהחציון','השונות שווה לממוצע','היא מוגדרת רק לערכים חיוביים'],
 e:SOL({ask:'איזו תכונה מתקיימת תמיד בהתפלגות נורמלית.',
   why:'העקומה הנורמלית היא פעמון סימטרי סביב μ. השיא שלה (השכיח) נמצא ב־μ, חצי מהשטח משני צדי μ (החציון), ובגלל הסימטריה גם הממוצע הוא μ.',
   steps:['סימטריה סביב μ ולכן החציון = μ.', 'השיא של הפעמון ב־μ ולכן השכיח = μ.', 'הממוצע של התפלגות סימטרית הוא מרכז הסימטריה, μ.'],
   res:'בהתפלגות נורמלית הממוצע, החציון והשכיח שווים.',
   tip:'ממוצע ≠ חציון הוא סימן לאסימטריה, ולכן לא יכול לקרות בהתפלגות נורמלית.'}),
 w:[null,
   'ממוצע גדול מהחציון מאפיין התפלגות אסימטרית ימנית. ההתפלגות הנורמלית סימטרית, ושניהם שווים.',
   'שונות ששווה לממוצע מאפיינת התפלגות פואסון. בנורמלית μ ו־σ² הם שני פרמטרים נפרדים, ואין קשר ביניהם.',
   'ההתפלגות הנורמלית מוגדרת על כל הישר, מ־<bdi dir="ltr">−∞</bdi> עד <bdi dir="ltr">+∞</bdi>. לכן תשואה נורמלית יכולה להיות גם שלילית.']},
{q:'תשואת תיק מתפלגת נורמלית עם ממוצע 10% וסטיית תקן 20%. מהי התשואה שההסתברות לקבל תשואה נמוכה ממנה היא 5% (VaR ברמה של 5%)?', o:['−22.9%','−29.2%','−30.0%','−13.0%'],
 e:SOL({ask:'הערך שמתחתיו נמצאים רק 5% מהתשואות, כלומר האחוזון ה־5 של ההתפלגות.',
   f:'<bdi dir="ltr">x = μ + z·σ , z<sub>0.05</sub> = −1.645</bdi>',
   why:'מוצאים בטבלה את ציון התקן שמשאיר 5% משמאלו, ואז מתרגמים אותו בחזרה ליחידות של תשואה: יורדים z סטיות תקן מהממוצע.',
   steps:['מהטבלה: <bdi dir="ltr">Φ(1.645) = 0.95</bdi>, ולכן <bdi dir="ltr">z = −1.645</bdi> משאיר 5% משמאלו', 'מציבים: <bdi dir="ltr">x = 10% − 1.645·20%</bdi>', 'מחשבים: <bdi dir="ltr">10% − 32.9% = −22.9%</bdi>'],
   res:'התשואה היא ‎−22.9%.',
   tip:'זנב אחד של 5%: 1.645. שני זנבות של 2.5% כל אחד: 1.96.'}),
 w:[null,
   '‎−29.2% מתקבל עם <bdi dir="ltr">z = 1.96</bdi>: <bdi dir="ltr">10 − 1.96·20 = −29.2</bdi>. הערך 1.96 משאיר 2.5% בזנב, וכאן מבקשים 5% בזנב אחד, כלומר 1.645.',
   '‎−30.0% מתקבל עם <bdi dir="ltr">z = 2</bdi>: <bdi dir="ltr">10 − 2·20 = −30</bdi>. זה כלל האצבע של "שתי סטיות תקן", שמתאים לכ־2.3% בזנב ולא ל־5%.',
   '‎−13.0% מתקבל עם <bdi dir="ltr">z ≈ 1.15</bdi>: <bdi dir="ltr">10 − 1.15·20 = −13</bdi>. ערך כזה משאיר כ־12.5% בזנב. ל־5% בזנב צריך <bdi dir="ltr">z = 1.645</bdi>.']},
{q:'בהתפלגות עם ממוצע 100 וסטיית תקן 10, מהו ציון התקן של התצפית 85?', o:['−1.5','1.5','−0.15','−15'],
 e:SOL({ask:'כמה סטיות תקן התצפית 85 רחוקה מהממוצע, ובאיזה כיוון.',
   f:'<bdi dir="ltr">Z = (x − μ)/σ</bdi>',
   why:'ציון התקן מודד את המרחק מהממוצע ביחידות של סטיית תקן. הסימן אומר אם התצפית מעל הממוצע (+) או מתחתיו (−).',
   steps:['המרחק מהממוצע: <bdi dir="ltr">85 − 100 = −15</bdi>', 'מחלקים בסטיית התקן: <bdi dir="ltr">−15/10 = −1.5</bdi>'],
   res:'ציון התקן הוא ‎−1.5.',
   tip:'תצפית מתחת לממוצע תמיד מקבלת ציון תקן שלילי.'}),
 w:[null,
   '1.5 הוא הגודל הנכון אבל עם סימן הפוך. 85 נמצא <u>מתחת</u> לממוצע, ולכן ציון התקן שלילי: ‎−1.5.',
   '‎−0.15 מתקבל מחלוקה בשונות (<bdi dir="ltr">10² = 100</bdi>) במקום בסטיית התקן: <bdi dir="ltr">−15/100</bdi>. מחלקים ב־<bdi dir="ltr">σ = 10</bdi>.',
   '‎−15 הוא רק ההפרש <bdi dir="ltr">85 − 100</bdi>, בלי לחלק בסטיית התקן. ציון תקן נמדד ביחידות של σ: <bdi dir="ltr">−15/10 = −1.5</bdi>.']}
],
s5:[
{q:'כדי להקטין פי 2 את רוחב רווח הסמך, באותה רמת ביטחון, יש להגדיל את גודל המדגם פי:', o:['4','2','√2','8'],
 e:SOL({ask:'פי כמה צריך להגדיל את n כדי שרוחב רווח הסמך יקטן פי 2.',
   f:'<bdi dir="ltr">width = 2·z·σ/√n</bdi>',
   why:'n נמצא בנוסחה מתחת לשורש. כדי לחלק את הרוחב ב־2 צריך ש־√n יגדל פי 2, ולכן n עצמו צריך לגדול פי <bdi dir="ltr">2² = 4</bdi>.',
   steps:['רוצים: <bdi dir="ltr">√n<sub>new</sub> = 2·√n</bdi>', 'מעלים בריבוע: <bdi dir="ltr">n<sub>new</sub> = 4·n</bdi>'],
   res:'יש להגדיל את המדגם פי 4.',
   tip:'כדי להקטין את הרוחב פי k, מגדילים את המדגם פי k².'}),
 w:[null,
   '2 מתאים אם הרוחב היה פרופורציוני ל־<bdi dir="ltr">1/n</bdi>. הוא פרופורציוני ל־<bdi dir="ltr">1/√n</bdi>, ולכן הכפלת n פי 2 מקטינה את הרוחב רק פי <bdi dir="ltr">√2 ≈ 1.41</bdi>.',
   '√2 מתקבל אם מוציאים שורש מ־2 במקום להעלות בריבוע. הגדלת n פי √2 מקטינה את הרוחב רק פי <bdi dir="ltr">2<sup>1/4</sup> ≈ 1.19</bdi>. כדי לחלק את הרוחב ב־2 צריך <bdi dir="ltr">2² = 4</bdi>.',
   '8 מקטין את הרוחב פי <bdi dir="ltr">√8 ≈ 2.83</bdi>, יותר מהנדרש. מספיק פי 4.']},
{q:'נתון: σ = 20, n = 400. מהי טעות התקן של ממוצע המדגם?', o:['1','0.05','20','0.5'],
 e:SOL({ask:'סטיית התקן של ממוצע המדגם, כלומר עד כמה הממוצע משתנה ממדגם למדגם.',
   f:'<bdi dir="ltr">SE = σ/√n</bdi>',
   why:'ממוצע של הרבה תצפיות יציב יותר מתצפית בודדת. הפיזור שלו קטן פי √n מהפיזור של האוכלוסייה.',
   steps:['<bdi dir="ltr">√400 = 20</bdi>', '<bdi dir="ltr">SE = 20/20 = 1</bdi>'],
   res:'טעות התקן היא 1.',
   tip:'מחלקים בשורש של n, לא ב־n עצמו.'}),
 w:[null,
   '0.05 הוא <bdi dir="ltr">20/400</bdi>, חלוקה ב־n במקום ב־√n. צריך <bdi dir="ltr">20/√400 = 20/20 = 1</bdi>.',
   '20 הוא σ, סטיית התקן של תצפית בודדת. הממוצע של 400 תצפיות מפוזר הרבה פחות: מחלקים ב־<bdi dir="ltr">√400 = 20</bdi>.',
   '0.5 מתקבל אם מחלקים ב־40 במקום ב־20, למשל כשמכפילים את √n ב־2 בטעות. טעות התקן היא <bdi dir="ltr">σ/√n = 20/20 = 1</bdi>.']},
{q:'מעלים את רמת הביטחון מ־95% ל־99%, על סמך אותו מדגם. מה קורה לרווח הסמך?', o:['הוא מתרחב','הוא מצטמצם','הוא לא משתנה','מרכזו משתנה'],
 e:SOL({ask:'איך רמת הביטחון משפיעה על רוחב רווח הסמך.',
   f:'<bdi dir="ltr">x̄ ± z·σ/√n</bdi>',
   why:'כדי להיות בטוחים יותר שהרווח תופס את μ, צריך "רשת" רחבה יותר. ברמת ביטחון גבוהה יותר הערך הקריטי z גדל, ואיתו הרוחב.',
   steps:['ב־95%: <bdi dir="ltr">z = 1.96</bdi>. ב־99%: <bdi dir="ltr">z = 2.576</bdi>.', 'σ ו־n לא השתנו, ולכן הרוחב גדל פי <bdi dir="ltr">2.576/1.96 ≈ 1.31</bdi>.', 'המרכז, <bdi dir="ltr">x̄</bdi>, נשאר אותו דבר.'],
   res:'רווח הסמך מתרחב.',
   tip:'יותר ביטחון = רווח רחב יותר. כדי לצמצם רווח בלי לוותר על ביטחון צריך להגדיל את n.'}),
 w:[null,
   'הרווח מצטמצם כשמורידים את רמת הביטחון, לא כשמעלים אותה. ב־99% הערך הקריטי גדל מ־1.96 ל־2.576.',
   'הרוחב תלוי ב־z, ו־z משתנה עם רמת הביטחון (מ־1.96 ל־2.576). לכן הרווח משתנה.',
   'מרכז הרווח הוא ממוצע המדגם, והמדגם לא השתנה. רק הרוחב משתנה.']},
{q:'מה אומר משפט הגבול המרכזי?', o:['במדגמים גדולים, התפלגות ממוצע המדגם קרובה לנורמלית, בלי קשר להתפלגות האוכלוסייה','במדגמים גדולים האוכלוסייה הופכת לנורמלית','ממוצע המדגם תמיד שווה לממוצע האוכלוסייה','שונות המדגם שווה לשונות האוכלוסייה'],
 e:SOL({ask:'על מה משפט הגבול המרכזי מדבר, ומה הוא קובע.',
   f:'<bdi dir="ltr">X̄ ≈ N(μ, σ²/n)</bdi>',
   why:'כשממצעים הרבה תצפיות, הערכים הקיצוניים מקזזים זה את זה, וההתפלגות של הממוצע מקבלת צורת פעמון. זה קורה גם אם האוכלוסייה עצמה עקומה.',
   steps:['המשפט עוסק בהתפלגות של ממוצע המדגם, X̄.', 'כש־n גדול, X̄ מתפלג בקירוב נורמלית סביב μ, עם שונות <bdi dir="ltr">σ²/n</bdi>.', 'ההתפלגות של האוכלוסייה עצמה לא משתנה.'],
   res:'במדגמים גדולים התפלגות ממוצע המדגם קרובה לנורמלית, בלי קשר להתפלגות האוכלוסייה.',
   tip:'המשפט הוא על הממוצע, לא על התצפיות.'}),
 w:[null,
   'האוכלוסייה לא משתנה כשדוגמים ממנה. מה שמתקרב לנורמלי הוא ההתפלגות של <u>ממוצע</u> המדגם.',
   'ממוצע המדגם משתנה ממדגם למדגם. רק התוחלת שלו שווה ל־μ, ולא כל ממוצע בודד.',
   'שונות המדגם היא אומדן לשונות האוכלוסייה, ואינה שווה לה בכל מדגם. המשפט לא עוסק בה בכלל.']},
{q:'על סמך מדגם חושב רווח סמך ברמת ביטחון 95% לממוצע: [48 , 52]. מהי הפרשנות הנכונה?', o:['אם נחזור על הדגימה פעמים רבות, כ־95% מהרווחים שייבנו בשיטה זו יכילו את μ','μ הוא משתנה מקרי, ובהסתברות 95% הוא נמצא בין 48 ל־52','95% מהתצפיות נמצאות בין 48 ל־52','הממוצע האמיתי הוא 50'],
 e:SOL({ask:'מה המשמעות המדויקת של "95% ביטחון".',
   why:'μ הוא מספר קבוע שאיננו יודעים. מה שאקראי הוא הרווח: כל מדגם נותן רווח אחר. 95% מתארים את אחוז ההצלחה של השיטה לאורך הרבה מדגמים.',
   steps:['μ קבוע, ולכן אין "הסתברות ש־μ נמצא" ברווח מסוים. הוא בפנים או בחוץ.', 'האקראיות היא ברווח, שמחושב מהמדגם.', 'אם נבנה רווחים כאלה ממדגמים רבים, כ־95% מהם יכילו את μ.'],
   res:'אם נחזור על הדגימה פעמים רבות, כ־95% מהרווחים שייבנו בשיטה זו יכילו את μ.',
   tip:'רמת הביטחון היא תכונה של השיטה, לא של רווח אחד מסוים.'}),
 w:[null,
   'μ אינו משתנה מקרי, אלא קבוע לא ידוע. אחרי שהרווח חושב, μ פשוט נמצא בו או לא. ה־95% שייכים לשיטה, לא ל־μ.',
   'רווח הסמך הוא עבור <u>הממוצע</u>, לא עבור התצפיות. התצפיות מפוזרות הרבה יותר מהממוצע.',
   '50 הוא אמצע הרווח, כלומר ממוצע המדגם. זה אומדן ל־μ, ולא הערך האמיתי.']},
{q:'סטיית התקן באוכלוסייה היא 10. רוצים שטעות הדגימה המרבית, ברמת ביטחון 95%, לא תעלה על 2. מהו גודל המדגם המינימלי?', o:['97','96','10','385'],
 e:SOL({ask:'מה גודל המדגם הקטן ביותר שמבטיח חצי רוחב (טעות דגימה) של 2 לכל היותר.',
   f:'<bdi dir="ltr">n = (z·σ/E)²</bdi>',
   why:'טעות הדגימה המרבית היא <bdi dir="ltr">E = z·σ/√n</bdi>. מבודדים את n: מעבירים אגפים ומעלים בריבוע.',
   steps:['מציבים: <bdi dir="ltr">n = (1.96·10/2)²</bdi>', 'מחשבים: <bdi dir="ltr">1.96·10/2 = 9.8</bdi>', 'בריבוע: <bdi dir="ltr">9.8² = 96.04</bdi>', 'מעגלים כלפי מעלה: 97'],
   res:'גודל המדגם המינימלי הוא 97.',
   tip:'גודל מדגם מעגלים תמיד כלפי מעלה, גם אם החלק העשרוני קטן.'}),
 w:[null,
   '96 הוא עיגול כלפי מטה של 96.04. עם 96 תצפיות הטעות תהיה מעט מעל 2. לכן מעגלים כלפי מעלה: 97.',
   '10 מתקבל אם שוכחים להעלות בריבוע: <bdi dir="ltr">1.96·10/2 = 9.8 ≈ 10</bdi>. הנוסחה היא הריבוע של הביטוי: <bdi dir="ltr">9.8² = 96.04</bdi>.',
   '385 מתקבל אם מציבים <bdi dir="ltr">E = 1</bdi> (חצי מ־2): <bdi dir="ltr">(1.96·10/1)² = 384.16</bdi>. טעות הדגימה המרבית כבר היא חצי רוחב הרווח, ולכן מציבים 2.']}
],
s6:[
{q:'מהי טעות מסוג ראשון?', o:['דחיית H₀ כשהיא נכונה','אי־דחיית H₀ כשהיא לא נכונה','דחיית H₁ כשהיא נכונה','בחירת α גדול מדי'],
 e:SOL({ask:'ההגדרה של טעות מסוג ראשון.',
   why:'במבחן השערות יש שתי טעויות אפשריות: לדחות השערת אפס נכונה (סוג ראשון), או לא לדחות השערת אפס שגויה (סוג שני). רמת המובהקות α היא בדיוק ההסתברות לטעות מהסוג הראשון.',
   steps:['H₀ נכונה, ודוחים אותה: טעות מסוג ראשון. ההסתברות לה: α.', 'H₀ שגויה, ולא דוחים אותה: טעות מסוג שני. ההסתברות לה: β.'],
   res:'טעות מסוג ראשון היא דחיית H₀ כשהיא נכונה.',
   tip:'סוג ראשון = "אזעקת שווא": מכריזים על תגלית שאינה קיימת.'}),
 w:[null,
   'זו טעות מסוג <u>שני</u>: לא דוחים את H₀ אף שהיא שגויה. ההסתברות לה היא β.',
   'דחיית H₁ כשהיא נכונה היא בעצם אי־דחייה של H₀ שגויה, כלומר טעות מסוג שני.',
   'בחירת α היא החלטה של החוקר לפני המבחן, לא טעות בהחלטה. α קובע את <u>ההסתברות</u> לטעות מסוג ראשון.']},
{q:'במבחן השערות התקבל p-value של 0.03, ורמת המובהקות היא 5%. מה ההחלטה?', o:['דוחים את H₀','לא דוחים את H₀','מקבלים את H₀','צריך מדגם נוסף'],
 e:SOL({ask:'איך מחליטים במבחן השערות לפי p-value.',
   f:'<bdi dir="ltr">p-value < α</bdi> ולכן דוחים את H₀',
   why:'ה־p-value הוא ההסתברות לקבל תוצאה קיצונית כמו זו שקיבלנו, אם H₀ נכונה. אם היא קטנה מהסף α, התוצאה חריגה מדי בשביל H₀, ודוחים אותה.',
   steps:['משווים: <bdi dir="ltr">0.03 < 0.05</bdi>', 'ה־p-value קטן מ־α, ולכן דוחים את H₀.'],
   res:'דוחים את H₀.',
   tip:'p-value קטן מ־α פירושו דוחים. p-value גדול מ־α פירושו לא דוחים.'}),
 w:[null,
   'לא דוחים רק כש־p-value גדול מ־α. כאן <bdi dir="ltr">0.03 < 0.05</bdi>, ולכן דוחים.',
   'גם כשלא דוחים, לא "מקבלים" את H₀ אלא רק לא דוחים אותה. וכאן בכלל דוחים, כי <bdi dir="ltr">0.03 < 0.05</bdi>.',
   'יש מספיק מידע להחלטה: משווים את ה־p-value ל־α. אין צורך במדגם נוסף.']},
{q:'מקטינים את α, וגודל המדגם נשאר קבוע. מה יקרה ל־β?', o:['β גדל','β קטן','β לא משתנה','β = α'],
 e:SOL({ask:'מה הקשר בין ההסתברות לטעות מסוג ראשון (α) לזו של טעות מסוג שני (β), כשהמדגם קבוע.',
   why:'הקטנת α פירושה להחמיר: דורשים ראיות חזקות יותר כדי לדחות את H₀, ואזור הדחייה מצטמצם. כך יותר קשה לדחות את H₀ גם כשהיא באמת שגויה, ולכן β גדל.',
   steps:['α קטן ולכן הערך הקריטי זז החוצה, ואזור הדחייה קטן.', 'אזור אי־הדחייה גדל, ולכן גדל הסיכוי לא לדחות H₀ שגויה.', 'כלומר β גדל.'],
   res:'β גדל.',
   tip:'בגודל מדגם קבוע יש פשרה: מקטינים אחת מהטעויות, והשנייה גדלה. כדי להקטין את שתיהן מגדילים את n.'}),
 w:[null,
   'β קטן כשמגדילים את α (קל יותר לדחות), או כשמגדילים את המדגם. הקטנת α פועלת בכיוון ההפוך.',
   'α ו־β קשורים דרך הערך הקריטי. כשהוא זז, משתנים שניהם, ולכן β לא יכול להישאר קבוע.',
   'אין קשר של שוויון בין α ל־β. הם הסתברויות של שתי טעויות שונות, וכשאחת קטנה השנייה גדלה.']},
{q:'מהי עוצמת המבחן?', o:['ההסתברות לדחות את H₀ כשהיא לא נכונה','ההסתברות לדחות את H₀ כשהיא נכונה','ההסתברות לא לדחות את H₀ כשהיא נכונה','ה־p-value'],
 e:SOL({ask:'ההגדרה של עוצמת המבחן.',
   f:'<bdi dir="ltr">power = 1 − β</bdi>',
   why:'העוצמה מודדת עד כמה המבחן מצליח לזהות מצב שבו H₀ שגויה. β היא ההסתברות לפספס את זה, ולכן העוצמה היא המשלים שלה.',
   steps:['β = הסתברות לא לדחות H₀ שגויה.', 'העוצמה = <bdi dir="ltr">1 − β</bdi> = הסתברות לדחות H₀ שגויה.'],
   res:'עוצמת המבחן היא ההסתברות לדחות את H₀ כשהיא לא נכונה.',
   tip:'עוצמה = החלטה נכונה כש־H₀ שגויה.'}),
 w:[null,
   'זו ההגדרה של α, ההסתברות לטעות מסוג ראשון. העוצמה היא דחייה של H₀ <u>שגויה</u>.',
   'זו ההסתברות להחלטה נכונה כש־H₀ נכונה, כלומר <bdi dir="ltr">1 − α</bdi> (רמת הביטחון). העוצמה עוסקת במצב שבו H₀ שגויה.',
   'ה־p-value מחושב מהמדגם בהנחה ש־H₀ נכונה. העוצמה היא תכונה של המבחן כולו, ומחושבת בהנחה ש־H₀ שגויה.']},
{q:'סטטיסטי המבחן שהתקבל הוא Z = 2.2, בכיוון ההשערה החלופית. באיזה מקרה <u>לא</u> נדחה את H₀?', o:['מבחן חד־צדדי ברמת 1%','מבחן דו־צדדי ברמת 5%','מבחן חד־צדדי ברמת 5%','מבחן דו־צדדי ברמת 10%'],
 e:SOL({ask:'באיזה מבחן הערך הקריטי גבוה מ־2.2, כך ש־2.2 לא מספיק כדי לדחות.',
   f:'דוחים כאשר <bdi dir="ltr">Z > z<sub>crit</sub></bdi>',
   why:'במבחן חד־צדדי כל α נמצא בזנב אחד. במבחן דו־צדדי α מתחלק לשני זנבות, ולכן בכל זנב <bdi dir="ltr">α/2</bdi>. ככל שהשטח בזנב קטן יותר, הערך הקריטי גבוה יותר.',
   steps:['חד־צדדי 1%: זנב 1%, <bdi dir="ltr">z = 2.33</bdi>. <bdi dir="ltr">2.2 < 2.33</bdi>, ולכן לא דוחים.', 'דו־צדדי 5%: זנב 2.5%, <bdi dir="ltr">z = 1.96</bdi>. דוחים.', 'חד־צדדי 5%: זנב 5%, <bdi dir="ltr">z = 1.645</bdi>. דוחים.', 'דו־צדדי 10%: זנב 5%, <bdi dir="ltr">z = 1.645</bdi>. דוחים.'],
   res:'רק במבחן חד־צדדי ברמת 1% לא דוחים את H₀.',
   tip:'בדו־צדדי מחלקים את α לשניים לפני שמחפשים בטבלה.'}),
 w:[null,
   'בדו־צדדי ברמת 5% יש 2.5% בכל זנב, והערך הקריטי 1.96. <bdi dir="ltr">2.2 > 1.96</bdi>, ולכן דוחים.',
   'בחד־צדדי ברמת 5% הערך הקריטי 1.645. <bdi dir="ltr">2.2 > 1.645</bdi>, ולכן דוחים.',
   'בדו־צדדי ברמת 10% יש 5% בכל זנב, והערך הקריטי 1.645. <bdi dir="ltr">2.2 > 1.645</bdi>, ולכן דוחים.']}
],
s7:[
{q:'מקדם המתאם בין שני משתנים הוא ‎−0.9. מה הפירוש?', o:['קשר לינארי שלילי חזק','קשר חלש','אין קשר','X גורם לירידה ב־Y'],
 e:SOL({ask:'מה הסימן ומה הגודל של מקדם מתאם ‎−0.9 אומרים על הקשר.',
   why:'מקדם המתאם נע בין ‎−1 ל־1. הערך המוחלט מודד את חוזק הקשר הלינארי, והסימן את הכיוון שלו.',
   steps:['הערך המוחלט: <bdi dir="ltr">|−0.9| = 0.9</bdi>, קרוב ל־1, ולכן הקשר חזק.', 'הסימן שלילי: כש־X עולה, Y נוטה לרדת.', 'מתאם מתאר קשר, לא סיבה.'],
   res:'קשר לינארי שלילי חזק.',
   tip:'סימן = כיוון, ערך מוחלט = חוזק. מתאם אינו מוכיח סיבתיות.'}),
 w:[null,
   'הסימן השלילי לא אומר שהקשר חלש. החוזק נקבע לפי הערך המוחלט, 0.9, שקרוב ל־1.',
   '"אין קשר" מתאים למתאם קרוב ל־0. כאן הערך המוחלט 0.9, כלומר קשר חזק מאוד.',
   'מתאם לא מוכיח סיבתיות. ייתכן ש־Y משפיע על X, או שגורם שלישי משפיע על שניהם.']},
{q:'ברגרסיה לינארית פשוטה, מקדם המתאם הוא 0.6. איזה אחוז מהשונות של Y מוסבר על ידי X?', o:['36%','60%','40%','77%'],
 e:SOL({ask:'מקדם ההסבר R²: איזה חלק מהפיזור של Y קו הרגרסיה מסביר.',
   f:'<bdi dir="ltr">R² = r²</bdi>',
   why:'ברגרסיה פשוטה מקדם ההסבר הוא בדיוק ריבוע מקדם המתאם. הוא מבטא את חלק השונות של Y שמוסבר על ידי הקשר הלינארי עם X.',
   steps:['מעלים בריבוע: <bdi dir="ltr">0.6² = 0.36</bdi>', 'באחוזים: 36%'],
   res:'36% מהשונות של Y מוסברים על ידי X.',
   tip:'r = 0.6 נשמע גבוה, אבל רק כשליש מהשונות מוסבר. לא לשכוח להעלות בריבוע.'}),
 w:[null,
   '60% הוא מקדם המתאם עצמו. האחוז המוסבר הוא הריבוע שלו: <bdi dir="ltr">0.6² = 0.36</bdi>.',
   '40% הוא <bdi dir="ltr">1 − 0.6</bdi>. זה לא החלק הלא־מוסבר וגם לא המוסבר. החלק הלא־מוסבר הוא <bdi dir="ltr">1 − 0.36 = 0.64</bdi>.',
   '77% הוא <bdi dir="ltr">√0.6 ≈ 0.77</bdi>. צריך להעלות בריבוע, לא להוציא שורש.']},
{q:'נתון: Cov(X,Y) = 12, V(X) = 4, x̄ = 2, ȳ = 10. מהו החותך a בקו הרגרסיה Ŷ = a + bX?', o:['4','3','10','−2'],
 e:SOL({ask:'נקודת החיתוך של קו הרגרסיה עם ציר Y.',
   f:'<bdi dir="ltr">b = Cov(X,Y)/V(X) ; a = ȳ − b·x̄</bdi>',

{q:'מהו הערך הנוכחי של 1,000 ₪ שיתקבלו בסוף כל שנה במשך 3 שנים, בריבית של 10%?', o:['2,486.85 ₪','3,000 ₪','2,735.54 ₪','3,310 ₪'],

{q:'בהלוואת שפיצר, מה קורה לאורך הזמן לרכיב הקרן בכל תשלום?', o:['עולה','יורד','קבוע','מתאפס'],

{q:'שני פרויקטים מוציאים זה את זה. לפי NPV עדיף A, ולפי IRR עדיף B. מה בוחרים?', o:['את A, לפי NPV','את B, לפי IRR','את שניהם','את זה עם תקופת ההחזר הקצרה'],

{q:'מה החיסרון העיקרי של שיטת תקופת ההחזר?', o:['מתעלמת מערך הזמן של הכסף ומתזרימים שאחרי ההחזר','קשה לחשב אותה','דורשת לדעת את ה־IRR','תמיד דוחה פרויקטים טובים'],

s4:[() => {
  const mu = pick([50, 80, 100, 200]), sg = pick([5, 10, 20, 25]), z = pick([-2, -1.5, -1, -0.5, 0.5, 1, 1.5, 2]);

      f: GB('Z = (X − μ) / σ'),
      why: 'טבלת ההתפלגות הנורמלית נותנת שטחים רק להתפלגות הסטנדרטית (תוחלת 0, סטיית תקן 1). לכן קודם מתקננים: בודקים כמה סטיות תקן הערך רחוק מהתוחלת.',
      steps: [`מתקננים: ${GB(`Z = (${x} − ${mu}) / ${sg} = ${z}`)}`,
        z < 0 ? `מהטבלה ${GB(`Φ(${az}) = ${F(pa)}`)}, ולפי הסימטריה ${GB(`Φ(${z}) = 1 − ${F(pa)} = ${F(Phi(z))}`)}` : `מהטבלה: ${GB(`Φ(${z}) = ${F(Phi(z))}`)}`,
        above ? `השטח מימין: ${GB(`P(Z > ${z}) = 1 − ${F(Phi(z))} = ${F(p)}`)}` : `השטח משמאל הוא Φ עצמו: ${GB(`P(Z < ${z}) = ${F(p)}`)}`],

      tip: 'Φ(z) הוא תמיד השטח משמאל. לשטח מימין לוקחים 1 − Φ(z).'}),
    [`${F(1 - p)} הוא השטח בצד השני של ${x}. ${above ? `השאלה על "גדול מ־", כלומר השטח מימין: 1 − Φ(z), ולא Φ(z).` : `השאלה על "קטן מ־", כלומר השטח משמאל, וזה Φ(z) עצמו, בלי 1 − Φ(z).`}`,
     `${F(pa - 0.5)} הוא רק השטח שבין התוחלת ${mu} לבין ${x} (${GB(`${F(pa)} − 0.5`)}). צריך את כל השטח ${above ? 'מימין' : 'משמאל'} ל־${x}, כולל החצי שמעבר לתוחלת אם הוא בכיוון הזה.`,
     `${F(2 * (1 - pa))} מתקבל מהכפלת הזנב פי 2, כמו במבחן דו־צדדי (${GB(`2·(1 − ${F(pa)})`)}). כאן שואלים על צד אחד בלבד.`,
     `${F(pv)} מתקבל מחלוקה בשונות ${GB(`σ² = ${sg * sg}`)} במקום בסטיית התקן: ${GB(`(${x} − ${mu}) / ${sg * sg} = ${nf(zv, 3)}`)}. בתקנון מחלקים ב־σ = ${sg}.`]);

s5:[() => {

    e: SOL({ask: `טווח סביב ממוצע המדגם (${xb}) שבו נמצא הממוצע האמיתי של האוכלוסייה ברמת ביטחון ${c[0]}%.`,

      steps: [`טעות התקן: ${GB(`SE = ${sg} / √${n} = ${sg} / ${rn} = ${nf(se, 3)}`)}`,
        `מחצית רוחב הרווח: ${GB(`${c[1]}·${nf(se, 3)} = ${nf(E, 3)}`)}`,
        `גבולות: ${GB(`${xb} − ${nf(E, 2)} = ${nf(xb - E, 2)}`)} ו־${GB(`${xb} + ${nf(E, 2)} = ${nf(xb + E, 2)}`)}`],
      res: `רווח הסמך הוא ${GR(f(E))}.`,
      tip: 'ערכים קריטיים: 1.645 ל־90%, ‏1.96 ל־95%, ‏2.576 ל־99%. ותמיד מחלקים ב־√n.'})};

s6:[() => {
  const m0 = pick([50, 100, 200]), sg = pick([8, 10, 12, 15, 20]), n = pick([16, 25, 36, 64, 100]);
  const se = sg / Math.sqrt(n), z = pick([0.8, 1.2, 1.5, 1.8, 2.1, 2.4, 2.8, -2.2, -1.4]), xb = Math.round((m0 + z * se) * 100) / 100;

  const opt = (v, r) => `Z = ${nf(v, 2)}, ${dec(r)}`;

    [opt(Z, rej), null],
    [opt(Z, !rej), `הסטטיסטי ${GB(nf(Z, 2))} נכון, אבל ההחלטה הפוכה. במבחן דו־צדדי ברמת 5% דוחים את H₀ רק כש־|Z| גדול מ־1.96. כאן ${GB(`|Z| = ${nf(Math.abs(Z), 2)}`)}, ${rej ? 'גדול מ־1.96, ולכן דוחים' : 'קטן מ־1.96, ולכן לא דוחים'}.`],
    [opt(Zw, Math.abs(Zw) > 1.96), `${GB(`Z = ${nf(Zw, 2)}`)} מתקבל מחלוקה ב־σ = ${sg} במקום בטעות התקן ${GB(`σ/√n = ${nf(se, 3)}`)}. בודקים ממוצע של ${n} תצפיות, ולכן מחלקים ב־σ/√n.`],
    [opt(Zn, Math.abs(Zn) > 1.96), `${GB(`Z = ${nf(Zn, 2)}`)} מתקבל מחלוקה ב־${GB(`σ/n = ${sg}/${n}`)} במקום ב־${GB(`σ/√n = ${sg}/${rn}`)}. טעות התקן של הממוצע היא σ חלקי השורש של n.`],
    [opt(Zv, Math.abs(Zv) > 1.96), `${GB(`Z = ${nf(Zv, 2)}`)} מתקבל משימוש בשונות ${GB(`σ² = ${sg * sg}`)} במקום בסטיית התקן: ${GB(`(${xb} − ${m0}) / (${sg * sg}/${rn})`)}. בטעות התקן משתמשים ב־σ = ${sg}.`]];
  const seen = new Set(), keep = cand.filter(([s]) => !seen.has(s) && seen.add(s));

    e: SOL({ask: `האם ממוצע המדגם ${xb} רחוק מספיק מ־${m0} כדי לקבוע שהממוצע האמיתי שונה מ־${m0}.`,
      f: GB('Z = (x̄ − μ<sub>0</sub>) / (σ/√n)'),
      why: 'הסטטיסטי סופר כמה טעויות תקן ממוצע המדגם רחוק מהערך שבהשערת האפס. המבחן דו־צדדי (≠), ולכן ברמת 5% מחלקים את α לשני הזנבות, והערך הקריטי הוא 1.96.',
      steps: [`טעות התקן: ${GB(`SE = ${sg} / √${n} = ${sg} / ${rn} = ${nf(se, 3)}`)}`,
        `הסטטיסטי: ${GB(`Z = (${xb} − ${m0}) / ${nf(se, 3)} = ${nf(Z, 2)}`)}`,
        `משווים לערך הקריטי: ${GB(`|Z| = ${nf(Math.abs(Z), 2)} ${rej ? '>' : '<'} 1.96`)}, ולכן ${dec(rej)}.`],
      res: `${GR(`Z = ${nf(Z, 2)}`)}, ו${dec(rej)}.`,
      tip: 'במבחן דו־צדדי ברמת 5% משווים את |Z| ל־1.96 (לא ל־1.645, שהוא הערך של מבחן חד־צדדי).'})};
}],
s7:[() => {

f1:[() => {

      steps: [`מציבים: ${GB(`PV = ${nf(fv2, 0)} / ${R}<sup>${n}</sup>`)}`,

f2:[() => {

f3:[() => {
  const L = pick([50000, 100000, 200000, 300000]), r = pick([0.04, 0.05, 0.06, 0.08]), n = pick([3, 4, 5, 6, 10]);

      f: GB('PMT = L·r / (1 − (1 + r)<sup>−n</sup>)'),
      why: 'בשפיצר כל התשלומים שווים. הערך הנוכחי של כל התשלומים, בריבית ההלוואה, חייב להיות שווה לסכום ההלוואה. מכאן מחלצים את התשלום.',
      steps: [`מכנה: ${GB(`1 − ${R}<sup>−${n}</sup> = 1 − ${nf(R ** -n, 6)} = ${nf(dn, 6)}`)}`,
        `מונה: ${GB(`${nf(L, 0)}·${r} = ${nf(L * r, 2)}`)}`,
        `מחלקים: ${GB(`${nf(L * r, 2)} / ${nf(dn, 6)} = ${N(pmt)}`)}`],

     `${N(L / n + L * r)} ₪ הוא התשלום הראשון בשיטת קרן שווה (${GB(`${nf(L / n, 2)} + ${nf(L * r, 2)}`)}). בשפיצר התשלום קבוע ומחושב בנוסחת השפיצר.`,
     `${N(L * (1 + r) ** n / n)} ₪ מתקבל מצבירת כל ההלוואה ל־${n} שנים וחלוקה שווה (${GB(`${nf(L, 0)}·${R}<sup>${n}</sup>/${n}`)}). כך משלמים ריבית גם על קרן שכבר הוחזרה.`,

      f: GB('PV = C·(1 − (1 + r)<sup>−n</sup>) / r'),
      why: 'זו נוסחת הערך הנוכחי של סדרת תשלומים שווים (אנונה): היא מהוונת כל תקבול לפי מועדו ומחברת את כולם בבת אחת.',
      steps: [`גורם: ${GB(`1 − ${R}<sup>−${n}</sup> = 1 − ${nf(R ** -n, 6)} = ${nf(1 - R ** -n, 6)}`)}`,

f4:[() => {

f5:[() => {

    [`${GB(F(-D * dy))} מתקבל משימוש במח״מ מקולי (${D}) ישירות. בנוסחה משתמשים במח״מ המתואם: ${GB(`${D}/${1 + y} = ${nf(Ds, 3)}`)}.`,
     `${GB(F(-ch))} הוא הגודל הנכון עם סימן הפוך. כשהתשואה ${dy > 0 ? 'עולה, המחיר יורד' : 'יורדת, המחיר עולה'}: יש מינוס בנוסחה.`,
     `${GB(F(-D * dy / (1 + dy)))} מתקבל מחלוקה ב־${GB(`(1 + Δy)`)} במקום ב־${GB(`(1 + y) = ${1 + y}`)}. המח״מ המתואם מחושב עם התשואה לפדיון עצמה.`,
     `${GB(F(-D * (1 + y) * dy))} מתקבל מהכפלה ב־${GB(`(1 + y)`)} במקום חלוקה. ${GB('D* = D/(1 + y)')}, ולכן הוא קטן ממח״מ מקולי.`]);
}],
f6:[() => {
  const s1 = pick([0.02, 0.03, 0.04, 0.05]), s2 = s1 + pick([0.005, 0.01, 0.015, -0.005]);
  const f = (1 + s2) ** 2 / (1 + s1) - 1, F = x => pct(x, 2);
  return G('f6', `ריבית הספוט לשנה היא ${pct(s1, 1)}, ולשנתיים ${pct(s2, 1)}. מהי ריבית הפורוורד לשנה השנייה?`, f,
    [(1 + s2) / (1 + s1) - 1, (s1 + s2) / 2, s1 + s2, s2 - s1, 2 * s2 - s1], F,
    SOL({ask: 'איזו ריבית לשנה השנייה בלבד מתאימה לריביות הספוט, כך שאין יתרון להשקעה לשנתיים על פני שתי השקעות של שנה.',
      f: GB('(1 + s<sub>2</sub>)² = (1 + s<sub>1</sub>)·(1 + f)'),
      why: `השקעה לשנתיים בריבית ${pct(s2, 1)} צריכה להניב כמו שנה ב־${pct(s1, 1)} ואחריה שנה בריבית הפורוורד. משווים את גורמי הצבירה ומחלצים את f.`,
      steps: [`צבירה לשנתיים: ${GB(`${nf(1 + s2, 3)}² = ${nf((1 + s2) ** 2, 6)}`)}`,
        `מחלקים בצבירה של השנה הראשונה: ${GB(`${nf((1 + s2) ** 2, 6)} / ${nf(1 + s1, 3)} = ${nf(1 + f, 6)}`)}`,
        `מורידים 1: ${GB(`f = ${F(f)}`)}`],
      res: `ריבית הפורוורד לשנה השנייה היא ${GR(F(f))}.`,
      tip: 'ריבית הספוט לשנתיים בריבוע (שתי שנים), חלקי השנה הראשונה. בקירוב: 2·s<sub>2</sub> − s<sub>1</sub>.'}),
    [`${F((1 + s2) / (1 + s1) - 1)} מתקבל בלי להעלות את ${GB(nf(1 + s2, 3))} בריבוע. ריבית הספוט לשנתיים נצברת שנתיים, ולכן הגורם בריבוע.`,
     `${F((s1 + s2) / 2)} הוא ממוצע של שתי ריביות הספוט. ריבית הספוט לשנתיים היא בעצמה מעין ממוצע של השנה הראשונה והשנייה, ולכן f רחוקה יותר מ־${pct(s1, 1)}.`,
     `${F(s1 + s2)} הוא סכום שתי הריביות, שאין לו משמעות כריבית לשנה אחת.`,
     `${F(s2 - s1)} הוא ההפרש בין הריביות. הפורוורד היא ריבית שלמה לשנה השנייה, לא רק התוספת.`,
     `${F(2 * s2 - s1)} הוא קירוב ליניארי (${GB('2·s<sub>2</sub> − s<sub>1</sub>')}). הוא מתעלם מריבית על ריבית; החישוב המדויק עם גורמי צבירה נותן ${F(f)}.`]);
}],
f7:[() => {
  const D0 = pick([1, 1.5, 2, 2.5, 3, 4]), g = pick([0.02, 0.03, 0.04, 0.05]), k = g + pick([0.04, 0.05, 0.06, 0.07]);
  const p = D0 * (1 + g) / (k - g), F = x => nf(x, 2) + ' ₪', N = x => nf(x, 2), D1 = D0 * (1 + g);
  return G('f7', `החברה חילקה זה עתה דיבידנד של ${nf(D0, 2)} ₪. שיעור הצמיחה הקבוע ${pct(g, 0)}, והתשואה הנדרשת ${pct(k, 0)}. מהו מחיר המניה?`, p,
    [D0 / (k - g), D0 * (1 + g) / k, D0 * (1 + g) ** 2 / (k - g), D0 * (1 + g) / (k + g)], F,
    SOL({ask: 'כמה שווה היום מניה שמחלקת דיבידנד שגדל בקצב קבוע לנצח (מודל גורדון).',
      f: GB('P<sub>0</sub> = D<sub>1</sub> / (k − g)'),
      why: `המחיר היום הוא הערך הנוכחי של כל הדיבידנדים העתידיים. הנוסחה משתמשת בדיבידנד של השנה הבאה (D<sub>1</sub>). הדיבידנד ${nf(D0, 2)} ₪ כבר חולק ולא שייך לקונה החדש, ולכן מגדילים אותו בשנה אחת של צמיחה.`,
      steps: [`הדיבידנד הבא: ${GB(`D<sub>1</sub> = ${nf(D0, 2)}·${1 + g} = ${nf(D1, 3)}`)}`,
        `המכנה: ${GB(`k − g = ${k} − ${g} = ${nf(k - g, 2)}`)}`,
        `מחלקים: ${GB(`${nf(D1, 3)} / ${nf(k - g, 2)} = ${N(p)}`)}`],
      res: `מחיר המניה הוא ${GR(N(p))} ₪.`,
      tip: '"חולק זה עתה" = D<sub>0</sub>. מכפילים ב־(1 + g) לפני שמציבים בנוסחה.'}),
    [`${N(D0 / (k - g))} ₪ מתקבל מהצבת ${GB(`D<sub>0</sub> = ${nf(D0, 2)}`)} בנוסחה. הדיבידנד הזה כבר חולק. צריך את הדיבידנד הבא: ${GB(`D<sub>1</sub> = ${nf(D1, 3)}`)}.`,
     `${N(D1 / k)} ₪ מתקבל מחלוקה ב־k בלבד, בלי להוריד את g. כך מתייחסים לדיבידנד כאילו הוא לא צומח.`,
     `${N(D0 * (1 + g) ** 2 / (k - g))} ₪ מתקבל מהגדלת הדיבידנד פעמיים (${GB(`D<sub>2</sub> = ${nf(D0 * (1 + g) ** 2, 3)}`)}). המחיר היום מחושב עם D<sub>1</sub>, הדיבידנד של השנה הבאה בלבד.`,
     `${N(D1 / (k + g))} ₪ מתקבל מחיבור g למכנה. במודל גורדון מחסירים את הצמיחה: ${GB('k − g')}.`]);
}],
f8:[() => {
  const s1 = pick([0.1, 0.15, 0.2]), s2 = pick([0.25, 0.3, 0.35]), rho = pick([-0.5, -0.2, 0, 0.2, 0.4, 0.6]), w = pick([0.3, 0.4, 0.5, 0.6, 0.7]);
  const v = w * w * s1 * s1 + (1 - w) ** 2 * s2 * s2 + 2 * w * (1 - w) * rho * s1 * s2, sd = Math.sqrt(v);
  const F = x => pct(x, 2), wb = nf(1 - w, 1), t1 = w * w * s1 * s1, t2 = (1 - w) ** 2 * s2 * s2, t3 = 2 * w * (1 - w) * rho * s1 * s2;
  return G('f8', `תיק מורכב מ־${pct(w, 0)} בנכס A (σ = ${pct(s1, 0)}), והשאר בנכס B (σ = ${pct(s2, 0)}). מקדם המתאם בין הנכסים ${rho}. מהי סטיית התקן של התיק?`, sd,
    [w * s1 + (1 - w) * s2, Math.sqrt(t1 + t2), Math.sqrt(t1 + t2 + t3 / 2), v], F,
    SOL({ask: 'מהו הסיכון (סטיית התקן) של תיק שמשלב שני נכסים, בהתחשב בקשר ביניהם.',
      f: GB('σ<sub>p</sub>² = w<sub>A</sub>²σ<sub>A</sub>² + w<sub>B</sub>²σ<sub>B</sub>² + 2·w<sub>A</sub>·w<sub>B</sub>·ρ·σ<sub>A</sub>·σ<sub>B</sub>'),
      why: 'הסיכון של תיק אינו ממוצע הסיכונים. כשהנכסים לא זזים יחד לגמרי (ρ < 1), חלק מהתנודות מתקזזות. האיבר האחרון מכניס את הקשר בין הנכסים.',
      steps: [`איבר A: ${GB(`${w}²·${s1}² = ${nf(t1, 5)}`)}`,
        `איבר B: ${GB(`${wb}²·${s2}² = ${nf(t2, 5)}`)}`,
        `איבר הקשר: ${GB(`2·${w}·${wb}·(${rho})·${s1}·${s2} = ${nf(t3, 5)}`)}`,
        `שונות התיק: ${GB(`${nf(t1, 5)} + ${nf(t2, 5)} + ${nf(t3, 5)} = ${nf(v, 5)}`)}`,
        `סטיית התקן: ${GB(`√${nf(v, 5)} = ${F(sd)}`)}`],
      res: `סטיית התקן של התיק היא ${GR(F(sd))}.`,
      tip: 'מחשבים קודם שונות, ורק בסוף מוציאים שורש. איבר הקשר מוכפל ב־2.'}),
    [`${F(w * s1 + (1 - w) * s2)} הוא ממוצע משוקלל של סטיות התקן. זה נכון רק כשמקדם המתאם 1. כאן ${GB(`ρ = ${rho}`)}, וחלק מהסיכון מתקזז.`,
     `${F(Math.sqrt(t1 + t2))} מתקבל בלי איבר הקשר (${GB(`2·w<sub>A</sub>·w<sub>B</sub>·ρ·σ<sub>A</sub>·σ<sub>B</sub>`)}). מותר להשמיט אותו רק כש־ρ = 0.`,
     `${F(Math.sqrt(t1 + t2 + t3 / 2))} מתקבל מאיבר הקשר בלי ההכפלה ב־2 (${GB(nf(t3 / 2, 5))} במקום ${GB(nf(t3, 5))}).`,
     `${F(v)} היא השונות של התיק (${nf(v, 5)}), לא סטיית התקן. צריך להוציא ממנה שורש.`]);
}],
f9:[() => {
  const rf = pick([0.02, 0.03, 0.04]), rm = rf + pick([0.04, 0.05, 0.06, 0.07]), b = pick([0.6, 0.8, 1.2, 1.4, 1.5]);
  const e = rf + b * (rm - rf), F = x => pct(x, 2);
  return G('f9', `הריבית חסרת הסיכון ${pct(rf, 0)}, תשואת השוק הצפויה ${pct(rm, 0)}, והבטא של המניה ${b}. מהי התשואה הנדרשת לפי מודל CAPM?`, e,
    [rf + b * rm, b * (rm - rf), rm + b * (rm - rf), b * rm], F,
    SOL({ask: 'איזו תשואה המשקיעים דורשים מהמניה בתמורה לסיכון השיטתי שלה.',
      f: GB('E(R) = r<sub>f</sub> + β·(E(R<sub>m</sub>) − r<sub>f</sub>)'),
      why: 'מקבלים את הריבית חסרת הסיכון, ועוד פיצוי על סיכון. הפיצוי הוא פרמיית הסיכון של השוק, מוכפלת בבטא: כמה המניה רגישה לשוק.',
      steps: [`פרמיית השוק: ${GB(`${pct(rm, 0)} − ${pct(rf, 0)} = ${pct(rm - rf, 0)}`)}`,
        `פרמיית המניה: ${GB(`${b}·${pct(rm - rf, 0)} = ${F(b * (rm - rf))}`)}`,
        `מוסיפים את הריבית חסרת הסיכון: ${GB(`${pct(rf, 0)} + ${F(b * (rm - rf))} = ${F(e)}`)}`],
      res: `התשואה הנדרשת היא ${GR(F(e))}.`,
      tip: 'הבטא מוכפלת בפרמיה (R<sub>m</sub> − r<sub>f</sub>), לא בתשואת השוק כולה.'}),
    [`${F(rf + b * rm)} מתקבל מהכפלת הבטא בתשואת השוק כולה (${GB(`${b}·${pct(rm, 0)}`)}). מכפילים רק בפרמיה ${GB(`${pct(rm, 0)} − ${pct(rf, 0)}`)}.`,
     `${F(b * (rm - rf))} היא פרמיית הסיכון של המניה בלבד. שכחו להוסיף את הריבית חסרת הסיכון ${pct(rf, 0)}.`,
     `${F(rm + b * (rm - rf))} מתקבל מהוספת הפרמיה לתשואת השוק במקום לריבית חסרת הסיכון. הבסיס בנוסחה הוא r<sub>f</sub> = ${pct(rf, 0)}.`,
     `${F(b * rm)} מתקבל מהכפלת הבטא בתשואת השוק בלבד. חסרים גם הריבית חסרת הסיכון וגם החיסור שלה מתשואת השוק.`]);
}, () => {
  const sm = pick([0.15, 0.2, 0.25]), b = pick([0.6, 0.8, 1.2, 1.5]), cov = b * sm * sm, F = x => nf(x, 3);
  return G('f9', `השונות המשותפת של המניה עם השוק היא ${nf(cov, 5)}, וסטיית התקן של השוק ${pct(sm, 0)}. מהי הבטא של המניה?`, b,
    [cov / sm, cov, sm * sm / cov, Math.sqrt(cov) / sm], F,
    SOL({ask: 'כמה המניה רגישה לתנודות השוק.',
      f: GB('β = Cov(R<sub>i</sub>, R<sub>m</sub>) / σ<sub>m</sub>²'),
      why: 'הבטא היא השיפוע של תשואת המניה ביחס לתשואת השוק. כמו בכל שיפוע רגרסיה, מחלקים את השונות המשותפת בשונות של המשתנה המסביר, כאן השוק.',
      steps: [`שונות השוק: ${GB(`σ<sub>m</sub>² = ${sm}² = ${nf(sm * sm, 4)}`)}`,
        `מחלקים: ${GB(`β = ${nf(cov, 5)} / ${nf(sm * sm, 4)} = ${F(b)}`)}`],
      res: `הבטא של המניה היא ${GR(F(b))}.`,
      tip: 'מחלקים בשונות השוק (σ²), לא בסטיית התקן. 20% בריבוע הוא 0.04.'}),
    [`${F(cov / sm)} מתקבל מחלוקה בסטיית התקן ${sm} במקום בשונות ${GB(`${sm}² = ${nf(sm * sm, 4)}`)}.`,
     `${F(cov)} היא השונות המשותפת עצמה. צריך לחלק אותה בשונות השוק ${nf(sm * sm, 4)}.`,
     `${F(sm * sm / cov)} מתקבל מחלוקה הפוכה: שונות השוק חלקי השונות המשותפת. השונות המשותפת במונה.`,
     `${F(Math.sqrt(cov) / sm)} מתקבל מהוצאת שורש מהשונות המשותפת, כאילו היא שונות, וחלוקה בסטיית התקן של השוק. בשונות המשותפת לא נוגעים: מחלקים אותה ב־σ<sub>m</sub>².`]);
}]
};

{id:'f10', area:'fin', title:'קבלת החלטות בתנאי אי־ודאות', short:'אי־ודאות',
lesson:`
<p>כשהתוצאה של השקעה אינה ידועה מראש, מתארים אותה באמצעות תרחישים: לכל תרחיש יש הסתברות ותשואה. מהתרחישים מחשבים את התוחלת, כלומר כמה מרוויחים בממוצע, ואת סטיית התקן, שמודדת עד כמה ההשקעה מסוכנת.</p>
<div class="fx" dir="ltr">E(R) = Σ p<sub>i</sub>·R<sub>i</sub><br>σ² = Σ p<sub>i</sub>·(R<sub>i</sub> − E(R))² ,&nbsp; CV = σ / E(R)</div>
<h4>קריטריונים לבחירה בין השקעות</h4>
<ul>
<li><b>תוחלת מקסימלית</b>: מתאים למשקיע אדיש לסיכון, ומתעלם מהפיזור.</li>
<li><b>תוחלת־שונות (מרקוביץ)</b>: A <b>שולטת</b> ב־B אם E(A) ≥ E(B) וגם σ(A) ≤ σ(B), כשלפחות אחד מאי־השוויונים חזק. כל משקיע שונא סיכון יעדיף את A.</li>
<li>כשאין שליטה, כלומר כשתשואה גבוהה יותר באה עם סיכון גבוה יותר, הבחירה תלויה בהעדפות המשקיע. מקדם ההשתנות מבטא את הסיכון ליחידת תשואה.</li>
</ul>
<h4>היחס לסיכון ופונקציית התועלת</h4>
<p>המשקיע מחשב <b>תוחלת תועלת</b> ובוחר באפשרות שתוחלת התועלת שלה הגבוהה ביותר: E[U] = Σ p·U(x).</p>
<ul>
<li><b>שונא סיכון</b>: פונקציית תועלת קעורה (למשל √x). דוחה הימור הוגן, והשווה הוודאי שלו נמוך מהתוחלת.</li>
<li><b>אדיש לסיכון</b>: פונקציית תועלת לינארית. מחליט לפי התוחלת בלבד.</li>
<li><b>אוהב סיכון</b>: פונקציית תועלת קמורה (למשל x²). השווה הוודאי שלו גבוה מהתוחלת.</li>
</ul>
<div class="fx" dir="ltr">CE: U(CE) = E[U(X)]<br>risk premium = E(X) − CE</div>
<div class="ex"><b>דוגמה פתורה.</b> הימור: 50% לקבל 100 ו־50% לקבל 0. פונקציית התועלת: U = √x.<br>
E(X) = 50. E[U] = 0.5·10 + 0.5·0 = 5. השווה הוודאי: √CE = 5 ⇒ CE = 25.<br>
פרמיית הסיכון: 50 − 25 = 25. המשקיע שונא סיכון, ולכן יסכים לקבל 25 בוודאות במקום ההימור.</div>
<div class="ex"><b>דוגמה פתורה (שליטה).</b> A: תוחלת 10%, סטיית תקן 8%. B: תוחלת 9%, סטיית תקן 12%. C: תוחלת 14%, סטיית תקן 20%.<br>
A שולטת ב־B (תשואה צפויה גבוהה יותר וסיכון נמוך יותר), ולכן B נפסלת. בין A ל־C אין שליטה. מקדם ההשתנות של A הוא 0.8, ושל C הוא 1.43.</div>
<div class="plain"><b>במילים פשוטות:</b> רוב האנשים מעדיפים 25 ₪ בוודאות על פני הטלת מטבע על 100 ₪. הפער בין מה שההימור שווה בממוצע לבין הסכום הוודאי שתסכים לקבל במקומו הוא פרמיית הסיכון.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחשב שונות בלי לשקלל לפי ההסתברויות.</li>
<li>לקבוע ש־C עדיפה על A רק כי התוחלת שלה גבוהה יותר. כשאין שליטה, אין תשובה חד־משמעית.</li>
<li>לזהות את השווה הוודאי עם תוחלת התועלת עצמה. צריך להפעיל את הפונקציה ההפוכה, למשל להעלות בריבוע.</li>
</ul></div>`},
{id:'s8', area:'stat', title:'מבוא לקומבינטוריקה', short:'קומבינטוריקה',
lesson:`
<p>קומבינטוריקה עונה על השאלה "בכמה דרכים?". הצעד הראשון בכל שאלה הוא לבדוק אם <b>הסדר חשוב</b> ואם מותרות <b>חזרות</b>.</p>
<div class="tbl-wrap"><table class="mini"><tr><th></th><th>עם חזרות</th><th>בלי חזרות</th></tr>
<tr><th>הסדר חשוב (חליפות)</th><td>n<sup>k</sup></td><td>n! / (n−k)!</td></tr>
<tr><th>הסדר אינו חשוב (צירופים)</th><td>C(n+k−1, k)</td><td>C(n,k) = n! / (k!(n−k)!)</td></tr></table></div>
<h4>כללים נוספים</h4>
<ul>
<li><b>עיקרון הכפל</b>: אם את שלב א' אפשר לבצע ב־m דרכים ואת שלב ב' ב־n דרכים, יש בסך הכול m·n אפשרויות.</li>
<li><b>תמורות</b>: מספר הסידורים של n עצמים שונים בשורה הוא n!.</li>
<li><b>תמורות עם עצמים זהים</b>: n! / (n₁!·n₂!·…).</li>
<li><b>סידור במעגל</b>: (n−1)!.</li>
<li>C(n,k) = C(n,n−k), ו־C(n,0) = C(n,n) = 1.</li>
</ul>
<h4>חישוב הסתברות בעזרת ספירה (התפלגות היפרגאומטרית)</h4>
<div class="fx" dir="ltr">P = (favorable outcomes) / (total outcomes)<br>P(k of the K special, sample n of N) = C(K,k)·C(N−K, n−k) / C(N,n)</div>
<div class="ex"><b>דוגמה פתורה.</b> בתיק 10 מניות, 4 מהן מניות טכנולוגיה. בוחרים באקראי 3 מניות.<br>
מספר האפשרויות הכולל: C(10,3) = 120.<br>
בדיוק 2 מניות טכנולוגיה: C(4,2)·C(6,1) = 6·6 = 36 ⇒ P = 36/120 = 0.3.<br>
אף לא מניית טכנולוגיה אחת: C(6,3) = 20 ⇒ P = 1/6.<br>
בכמה דרכים לבחור יו"ר, סגן וגזבר מתוך 10 אנשים? כאן הסדר חשוב: 10·9·8 = 720.</div>
<div class="plain"><b>במילים פשוטות:</b> אם החלפה בין שניים מהנבחרים יוצרת תוצאה חדשה (למשל יו"ר וסגן), הסדר חשוב. אם מתקבלת אותה תוצאה (למשל ועדה של שלושה), הסדר אינו חשוב, ומחלקים ב־k!.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להשתמש בצירופים כשיש תפקידים שונים, או להפך.</li>
<li>לשכוח לחלק במספר הסידורים של העצמים הזהים. למשל, מספר הסידורים של האותיות במילה "ABBA" הוא 4!/2!2! = 6.</li>
<li>להכפיל במקום לחבר כשיש מקרים נפרדים ("בדיוק 2 <u>או</u> בדיוק 3").</li>
</ul></div>`}
);

const perm = (n, k) => { let r = 1; for (let i = 0; i < k; i++) r *= n - i; return r; };

  const ps = pick([[0.2, 0.5, 0.3], [0.3, 0.4, 0.3], [0.25, 0.5, 0.25], [0.1, 0.6, 0.3]]), rs = [ri(15, 30), ri(5, 12), -ri(5, 20)];
  const E = ps.reduce((a, p, i) => a + p * rs[i], 0), V = ps.reduce((a, p, i) => a + p * (rs[i] - E) ** 2, 0), sd = Math.sqrt(V);

    [Math.sqrt(rs.reduce((a, r) => a + (r - E) ** 2, 0) / 3), V, Math.sqrt(ps.reduce((a, p, i) => a + p * rs[i] ** 2, 0))], x => nf(x, 2) + '%',
    `E = ${ps.map((p, i) => `${p}·${rs[i]}`).join(' + ')} = ${nf(E, 2)}%. σ² = Σp(R − E)² = ${nf(V, 2)}. σ = ${nf(sd, 2)}%.`);
}, () => {
  const hi = pick([400, 900, 1600, 2500]), p = pick([0.5, 0.4, 0.6, 0.25]), lo = pick([0, 0, 100]);
  const EU = p * Math.sqrt(hi) + (1 - p) * Math.sqrt(lo), CE = EU * EU, EX = p * hi + (1 - p) * lo;
  return G('f10', `הימור: בהסתברות ${p} לקבל ${nf(hi, 0)} ₪, ובשאר המקרים ${lo} ₪. פונקציית התועלת: U = √x. מהו השווה הוודאי?`, CE,
    [EX, EU, EX - CE], x => nf(x, 2) + ' ₪',
    `E[U] = ${p}·√${hi} + ${nf(1 - p, 2)}·√${lo} = ${nf(EU, 3)}. CE = (${nf(EU, 3)})² = ${nf(CE, 2)}. התוחלת היא ${nf(EX, 2)}, ולכן פרמיית הסיכון היא ${nf(EX - CE, 2)}.`);

TOPICS.unshift({id:'f0', area:'base', title:'יסודות: אחוזים, חזקות ושורשים', short:'יסודות',
lesson:`
<p>כל המבחן נשען על ארבע פעולות החשבון ועל חזקות. מי ששולט בשיעור הזה יתקדם בשאר החומר הרבה יותר בקלות. מי שכבר מרגיש בטוח בחומר יכול לדלג עליו.</p>
<h4>1. אחוזים ושברים עשרוניים</h4>
<p>אחוז הוא חלק אחד ממאה, ולכן 5% הם 0.05. בנוסחאות מציבים תמיד את המספר העשרוני ולא את האחוז: ריבית של 5% מוצבת כ־0.05.</p>
<div class="fx" dir="ltr">5% = 0.05 &nbsp;·&nbsp; 0.4% = 0.004 &nbsp;·&nbsp; 130% = 1.3</div>
<h4>2. גורם הצמיחה (1 + r)</h4>
<p>r הוא שיעור השינוי כמספר עשרוני. עלייה של 5% היא הכפלה ב־1.05 (כי <bdi dir="ltr">1 + 0.05 = 1.05</bdi>), וירידה של 2% היא הכפלה ב־0.98 (כי <bdi dir="ltr">1 − 0.02 = 0.98</bdi>). כששני שינויים מתרחשים זה אחר זה, <b>מכפילים</b> את הגורמים ולא מחברים את האחוזים. למשל, עלייה של 10% ואחריה ירידה של 10%:</p>
<div class="fx" dir="ltr">1.10 × 0.90 = 0.99 → −1%</div>
<p>כלומר בסוף יש ירידה של 1%, ולא חזרה לנקודת ההתחלה. הירידה של 10% מחושבת על סכום גדול יותר (110 ולא 100), ולכן היא "מוחקת" יותר ממה שהעלייה הוסיפה.</p>
<h4>3. חזקות</h4>
<p>החזקה <bdi dir="ltr">(1.05)<sup>3</sup></bdi> פירושה <bdi dir="ltr">1.05 × 1.05 × 1.05 = 1.157625</bdi>. חזקה שלילית היא אחד חלקי החזקה החיובית: <bdi dir="ltr">(1.05)<sup>−3</sup> = 1/(1.05)<sup>3</sup> = 0.8638</bdi>. זה בדיוק מה שעושים בהיוון: סכום שיתקבל בעוד 3 שנים מכפילים ב־<bdi dir="ltr">(1.05)<sup>−3</sup></bdi> כדי לדעת כמה הוא שווה היום.</p>
<h4>4. שורשים וחזקה שברית</h4>
<p>חזקה של <bdi dir="ltr">1/12</bdi> היא שורש מסדר 12: המספר שאם מכפילים אותו בעצמו 12 פעמים, חוזרים למספר המקורי. כך הופכים ריבית שנתית אפקטיבית לריבית חודשית. למשל, ריבית שנתית של 10%:</p>
<div class="fx" dir="ltr">(1.10)<sup>1/12</sup> − 1 = 0.797%</div>
<p>כלומר 0.797% לחודש. במחשבון מקישים 1.1, אחר כך x<sup>y</sup>, ואז <bdi dir="ltr">(1÷12)</bdi>.</p>
<h4>5. הסימן Σ (סיגמה)</h4>
<p>הסימן Σ פירושו "סכום של כל האיברים". למשל, <bdi dir="ltr">Σ p·x</bdi> פירושו: מכפילים כל ערך x בהסתברות שלו p, ומחברים את כל המכפלות.</p>
<div class="ex"><b>תרגיל חימום.</b> מניה עלתה ב־20% ואחר כך ירדה ב־20%. היכן היא עומדת ביחס לנקודת ההתחלה?<br>
מכפילים את גורמי הצמיחה: <bdi dir="ltr">1.2 × 0.8 = 0.96</bdi>, כלומר ירידה של 4%. זו בדיוק המלכודת של ממוצע חשבוני מול ממוצע גיאומטרי, שמופיעה במבחן.</div>
<div class="plain"><b>במילים פשוטות:</b> בכל פעם שמשהו גדל באחוז מסוים, מכפילים ב־(1 + האחוז). כך כמעט כל שאלה במימון הופכת לשרשרת של הכפלות וחילוקים.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להציב 5 במקום 0.05.</li>
<li>לחבר אחוזים של תקופות שונות במקום להכפיל את גורמי הצמיחה.</li>
<li>לחלק ריבית שנתית אפקטיבית ב־12 במקום להוציא שורש מסדר 12.</li>
</ul></div>`});

{t:'f10', q:'הילה מתלבטת כיצד להשקיע את כספה. לפניה שתי מניות בלבד: מניית ״נובה״ ומניית ״דינמיקה״. תוחלת התשואה של ״נובה״ היא 7%, ותוחלת התשואה של ״דינמיקה״ היא 11%. סטיית התקן של ״דינמיקה״ גבוהה יותר. ידוע כי מקדם המתאם בין שתי המניות הוא שלילי (‎−0.3), ומכירה בחסר אסורה.<br>I. שילוב בין שתי המניות עשוי לשפר את יחס התשואה לסיכון של התיק.<br>II. משקיעה שונאת סיכון לא תשקול כלל השקעה במניה התנודתית יותר.<br>III. משקיעה אוהבת סיכון עשויה להשקיע את כל כספה במניה המסוכנת יותר.<br>IV. כאשר המתאם שלילי, שילוב המניות תמיד יביא לתשואה גבוהה יותר מהשקעה רק באחת מהן.<br>איזו/אילו מהטענות הנ״ל נכונה/ות?', o:R('טענות I ו־II בלבד.|טענה II בלבד.|טענות I ו־IV בלבד.|טענות II ו־IV בלבד.|טענות I ו־III בלבד.'), a:4,
 e:'I נכונה: מתאם שלילי מקטין את סיכון התיק.<br>II שגויה: אף מניה אינה שולטת בשנייה (ל״דינמיקה״ גם תשואה גבוהה יותר וגם סיכון גבוה יותר), ולכן גם משקיעה שונאת סיכון עשויה לשלב אותה.<br>III נכונה.<br>IV שגויה: תוחלת התיק היא ממוצע משוקלל של התוחלות, ולכן לעולם אינה עולה על 11%.'},
{t:'f3', q:'דנה מתכננת לרכוש אופניים חשמליים לבן שלה, תום, לרגל סיום בית הספר. החנות מציעה לה לשלם 8,000 ש״ח מייד, ולאחר מכן 5 תשלומים חודשיים, כשהתשלום הראשון (שיתבצע בעוד חודש) הוא 1,900 ש״ח, וכל תשלום אחריו צומח ב־0.2% ביחס לקודמו.<br>אם הריבית האפקטיבית השנתית שדנה משלמת על הלוואה עומדת על 4.07%, מהו הסכום המיידי המקסימלי שהיתה מוכנה לשלם היום במקום לשלם את המסלול המוצע (8,000 + 5 תשלומים)?', o:R('פחות מ־17,000 ש״ח.|בין 17,001 ש״ח ל־17,500 ש״ח.|בין 17,501 ש״ח ל־18,000 ש״ח.|בין 18,001 ש״ח ל־18,500 ש״ח.|יותר מ־18,501 ש״ח.'), a:1,
 e:'הריבית החודשית: 1.0407<sup>1/12</sup> − 1 = 0.333%. התשלומים בחודשים 1 עד 5: 1,900, 1,903.8, 1,907.6 וכן הלאה.<br>מהוונים כל תשלום בריבית החודשית ומקבלים ערך נוכחי של כ־9,443. מוסיפים את 8,000 ש״ח המיידיים: כ־17,443 ש״ח.<br>טיפ: גם בלי חישוב מדויק, סכום 5 התשלומים לפני היוון הוא 9,538. ההיוון מוריד פחות מ־2%, ולכן התשובה בטווח 17,001–17,500.'},
{t:'f9', q:'באחת מההרצאות בתוכנית למנהלי השקעות, הציג המרצה את המאפיינים של תיק השקעות הנמצא על קו ה־CML.<br>I. תיק הנמצא על קו ה־CML תמיד מהווה שילוב של תיק השוק עם נכס חסר סיכון.<br>II. תשואתו הצפויה של כל תיק הנמצא על קו ה־CML היא בהכרח שווה לתשואת תיק השוק.<br>III. תיק עם ביתא 1 אינו יכול להימצא על קו ה־CML.<br>איזו/אילו מבין הטענות הנ״ל נכונה/ות?', o:R('טענה I בלבד.|טענה II בלבד.|טענה III בלבד.|טענות II ו־III בלבד.|כל הטענות שגויות.'), a:0,
 e:'I נכונה: זו ההגדרה של ה־CML.<br>II שגויה: לאורך הקו התשואה הצפויה עולה עם הסיכון.<br>III שגויה: תיק השוק עצמו (β = 1) נמצא על ה־CML.'},
{t:'s8', q:'בחברת ההייטק ״חדשנות אינסופית״, הוחלט להושיב את ששת חברי צוות הפיתוח לשיחת צוות שבועית סביב שולחן עגול: יואב, דנה, תמר, גיל, רוני ונועם. דנה מסרבת לשבת ליד גיל (כלומר, לא מימין ולא משמאל לו).<br>בכמה דרכים שונות ניתן להושיב את ששת חברי הצוות סביב השולחן?', o:R('בין 60 ל־70|בין 71 ל־75|בין 76 ל־85|בין 86 ל־95|יותר מ־96'), a:1,
 e:'מספר הסידורים במעגל: (6−1)! = 120.<br>סידורים שבהם דנה יושבת ליד גיל: מתייחסים לשניהם כ״גוש״ אחד, ומקבלים (5−1)! = 24 סידורים. כופלים ב־2, כי כל אחד מהם יכול לשבת מימין: 48.<br>התשובה: 120 − 48 = 72.'},
{t:'f4', q:'להלן נתונים לגבי 4 פרויקטים:<div class="tbl-wrap"><table class="mini"><tr><th>פרויקט</th><th>השקעה (ש״ח)</th><th>IRR</th><th>NPV</th></tr><tr><td>א</td><td>40</td><td>22%</td><td>28</td></tr><tr><td>ב</td><td>80</td><td>20%</td><td>96</td></tr><tr><td>ג</td><td>60</td><td>17%</td><td>66</td></tr><tr><td>ד</td><td>100</td><td>15%</td><td>110</td></tr></table></div>בהינתן כי עומד לרשותו של אורי תקציב של 120 ש״ח בלבד וניתנה לו האפשרות להשקיע ביותר מפרויקט אחד וכן להשקיע גם בפרויקטים חלקיים, מה יהיה ה־NPV המקסימלי הכולל של השקעתו?', o:R('נמוך מ־110.0 ש״ח.|בין 110.01 ש״ח ל־122.00 ש״ח.|בין 122.01 ש״ח ל־134.00 ש״ח.|בין 134.01 ש״ח ל־145.00 ש״ח.|גבוה מ־145.01 ש״ח.'), a:3,
 e:'כשהתקציב מוגבל ואפשר להשקיע בחלקי פרויקטים, מדרגים לפי מדד הרווחיות PI = NPV/I: א 0.7, ב 1.2, ג 1.1, ד 1.1. ה־IRR אינו רלוונטי כאן.<br>פרויקט ב נכנס במלואו: 80 ש״ח, NPV של 96. נותרו 40 ש״ח לפרויקט ג או ד (PI של 1.1): 40·1.1 = 44.<br>סך הכול: 96 + 44 = 140.'},
{t:'f1', q:'מלכה זכתה במקום הראשון של כרטיס הגירוד ״חיש־גד״. כאשר הלכה למשרדי החברה לקבל את הפרס, הוצע למלכה לבחור היום באחת מתוך חמש אלטרנטיבות.<br>בהנחה כי שיעור הריבית השנתית האפקטיבית בשוק הינה 5%, באיזה מבין המסלולים הבאים כדאי למלכה לבחור?', o:R('שמונה תשלומים שווים של 2,650 ש״ח בסוף כל חודש וחצי, כאשר התשלום הראשון יהיה בעוד חודש וחצי מהיום.|תשלום של 7,600 ש״ח בעוד שנה וחצי מהיום, תשלום נוסף של 7,650 בעוד שנתיים מהיום, ותשלום אחרון של 7,700 ש״ח בעוד שנתיים וחצי מהיום.|12 תשלומים חודשיים של 1,720 ש״ח בסוף כל חודש, כאשר התשלום הראשון הינו בסוף החודש השני מהיום.|שלושה תשלומים של 6,980 ש״ח בסוף כל ארבעה חודשים (סוף חודש 4, 8, ו־12).|תשלום חד־פעמי היום בסכום של 20,000 ש״ח.'), a:1,
 e:'מחשבים את הערך הנוכחי של כל מסלול בריבית שנתית של 5%. מהוונים ב־1.05<sup>t</sup>, כאשר t נמדד בשנים.<br>א (בחודשים 1.5, 3, …, 12): 20,628. ב: 7,600/1.05<sup>1.5</sup> + 7,650/1.05² + 7,700/1.05<sup>2.5</sup> = <b>20,818</b>. ג (בחודשים 2 עד 13): 20,022. ד: 20,272. ה: 20,000.<br>הערך הנוכחי הגבוה ביותר הוא של מסלול ב.'},
{t:'f9', q:'הניחו עולם בו מתקיים מודל ה־CAPM וקו שוק ההון (CML) הינו כמו בתרשים: הקו יוצא מ־r<sub>f</sub>, משיק לחזית היעילה בנקודה M (תיק השוק), נקודה A נמצאת על הקו בין r<sub>f</sub> ל־M, ונקודה F על הקו מעבר ל־M.<svg viewBox="0 0 320 170" style="max-width:320px;display:block;margin:10px 0" role="img" aria-label="CML"><line x1="30" y1="150" x2="310" y2="150" stroke="var(--muted)"/><line x1="30" y1="150" x2="30" y2="10" stroke="var(--muted)"/><path d="M90 140 Q130 85 170 78 T300 70" fill="none" stroke="var(--gold)" stroke-width="2"/><line x1="30" y1="115" x2="290" y2="30" stroke="var(--accent)" stroke-width="2"/><circle cx="30" cy="115" r="4" fill="var(--ink)"/><circle cx="85" cy="97" r="4" fill="var(--ink)"/><circle cx="150" cy="76" r="4" fill="var(--ink)"/><circle cx="270" cy="37" r="4" fill="var(--ink)"/><text x="36" y="132" font-size="12" fill="var(--ink)">rf</text><text x="80" y="88" font-size="12" fill="var(--ink)">A</text><text x="146" y="67" font-size="12" fill="var(--ink)">M</text><text x="270" y="28" font-size="12" fill="var(--ink)">F</text><text x="236" y="58" font-size="11" fill="var(--accent)">CML</text><text x="250" y="88" font-size="11" fill="var(--gold)">חזית יעילה</text><text x="275" y="165" font-size="11" fill="var(--muted)">σ</text><text x="8" y="16" font-size="11" fill="var(--muted)">E</text></svg>I. ניתן לתמחר נכס יחיד באמצעות קו ה־CML.<br>II. ניתן לתמחר תיק יעיל באמצעות קו ה־CML.<br>III. משקיע הנמצא על נקודה A הינו משקיע מלווה המחלק את כספו בין הריבית חסרת הסיכון (rf) ל־M.<br>איזו/אילו מהטענות הנ״ל נכונה/ות?', o:R('טענה I בלבד.|טענה II בלבד.|טענה III בלבד.|טענות II ו־III בלבד.|כל הטענות.'), a:3,
 e:'I שגויה: נכס בודד מתומחר לפי ה־SML (לפי הבטא שלו), ולא לפי ה־CML.<br>II נכונה.<br>III נכונה: בין r<sub>f</sub> ל־M המשקיע הוא ״מלווה״, כלומר משקיע חלק מכספו בנכס חסר הסיכון. בנקודה F הוא לווה.'},
{t:'f9', q:'בקרן נאמנות ״הנאמנים״ הביתא שווה ל־1.2 והסיכון הספציפי שווה ל־0.<br>I. קרן הנאמנות בהכרח נמצאת על קו ה־SML.<br>II. קרן הנאמנות בהכרח נמצאת על קו ה־CML.<br>III. לקרן סטיית תקן השווה לסטיית התקן של תיק השוק.<br>איזו/אילו מבין הטענות הנ״ל נכונה/ות?', o:R('טענה I בלבד.|טענה II בלבד.|טענה III בלבד.|טענות I ו־II בלבד.|כל הטענות.'), a:3,
 e:'כשהסיכון הספציפי 0, הקרן היא תיק יעיל ולכן נמצאת על ה־CML (II). בעולם של CAPM כל נכס נמצא על ה־SML (I).<br>III שגויה: σ<sub>i</sub>² = β²σ<sub>m</sub>² + 0 ⇒ σ<sub>i</sub> = 1.2σ<sub>m</sub>.'},
{t:'f9', q:'איזה מהמשפטים הבאים <u>אינו</u> נכון?', o:R('תיק יעיל הוא תיק שבו כל מרכיב הסיכון הספציפי פוזר.|הביתא של כל תיק יעיל עומדת על 1.|הקורלציה (מקדם מיתאם) בין תשואת השוק לתשואת כל תיק יעיל שווה ל־1.|ככלל, ניתן להקטין את מרכיב הסיכון הספציפי בתיק על ידי השקעה בנכסים נוספים.|מודל ה־CAPM קובע כי יש לפצות משקיעים בגין הסיכון השיטתי, אך לא בגין הסיכון הספציפי.'), a:1,
 e:'לתיק יעיל יכולה להיות כל בטא: בשילוב של תיק השוק ונכס חסר סיכון, הבטא שווה למשקל של תיק השוק (למשל 0.5). כל שאר המשפטים נכונים.<br>שימו לב: המתאם בין תיק יעיל לבין השוק אכן 1, כי התיק הוא שילוב לינארי של M ושל נכס חסר סיכון.'},
{t:'f2', q:'קופת הגמל ״תשואה״ פרסמה כי בשנת 2024 השיגה את התשואות החודשיות הבאות:<div class="tbl-wrap"><table class="mini"><tr><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th><th>6</th><th>7</th><th>8</th><th>9</th><th>10</th><th>11</th><th>12</th></tr><tr><td>8.7%</td><td>‎−8.5%</td><td>6.2%</td><td>1.5%</td><td>‎−4.8%</td><td>3.5%</td><td>2.4%</td><td>‎−9.1%</td><td>‎−3.7%</td><td>5.8%</td><td>3.9%</td><td>‎−1.2%</td></tr></table></div>מה הייתה התשואה האפקטיבית החודשית שהשיגה הקופה ב־12 החודשים של שנת 2024?', o:R('נמוכה מ־0.1%|בין 0.1% ל־0.15%|בין 0.15% ל־0.2%|בין 0.2% ל־0.25%|בין 0.25% ל־0.3%'), a:3,
 e:'מחשבים ממוצע גיאומטרי. קודם מכפילים את כל הגורמים (1 + r): 1.087·0.915·1.062·…·0.988 = 1.0284, כלומר תשואה שנתית של 2.84%. אחר כך מוציאים שורש 12: 1.0284<sup>1/12</sup> − 1 = 0.234%.<br>המלכודת: הממוצע החשבוני (4.7%/12 = 0.39%) אינו נמצא באף אחד מהטווחים.'},
{t:'f8', q:'רייצ׳ל משקיעה בתיק מניות הכולל שתי מניות: ״רוס״ ו״מוניקה״. כמו כן, ידוע כי סטיית התקן של מניית רוס הינה 28% ואילו סטיית התקן של מניית מוניקה הינה 9%. בהינתן כי רייצ׳ל משיגה סטיית תקן של 8.67% באמצעות בניית תיק מינימום שונות עם שתי המניות, מהו מקדם המתאם בין שתי המניות?', o:R('נמוך מ־0.039.|בין 0.040 ל־0.046.|בין 0.0461 ל־0.054.|בין 0.0541 ל־0.060.|גבוה מ־0.061.'), a:[1, 2],
 e:'מציבים ערכי ρ מתוך הטווחים בנוסחת משקל המינימום שבדף הנוסחאות, ומחשבים את סטיית התקן. כש־ρ ≈ 0.043, משקל רוס בתיק כ־8.3% וסטיית התקן 8.67%, כלומר טווח ב. המפתח הרשמי קיבל גם את ג, כנראה בגלל רגישות לעיגול.<br>אינטואיציה: סטיית התקן של מוניקה לבדה 9%. הפיזור מוריד אותה רק מעט, ל־8.67%, ולכן המתאם נמוך מאוד אך חיובי.'}
];

const ST = [
{t:'f9', q:'לגבי קו ה־SML:<br>I. כל נכס, יעיל או לא, נמצא על ה־SML כאשר מודל ה־CAPM מתקיים.<br>II. שיפוע ה־SML הוא פרמיית הסיכון של השוק.<br>III. מניה הנמצאת מתחת ל־SML היא זולה.<br>איזו/אילו מהטענות הנ״ל נכונה/ות?', o:R('טענה I בלבד.|טענות I ו־II בלבד.|טענות II ו־III בלבד.|טענה III בלבד.|כל הטענות.'), a:1,
 e:'I ו־II נכונות.<br>III שגויה: מתחת ל־SML התשואה הצפויה נמוכה מהנדרשת, ולכן המניה <u>יקרה</u> (אלפא שלילית).'},

const HEBRE = /[\u0590-\u05FF]/;
const vt = (x, y, s, o = {}) => { const he = HEBRE.test(s), a = o.a || 'middle', anc = he && a !== 'middle' ? (a === 'end' ? 'start' : 'end') : a; return `<text x="${x}" y="${y}" direction="${he ? 'rtl' : 'ltr'}" text-anchor="${anc}" font-size="${Math.round((o.size || 18) * 1.2)}" font-weight="${o.w || 500}" fill="${o.fill || 'var(--ink)'}" font-family="${o.mono ? 'var(--mono)' : 'var(--body)'}">${he ? s.replace(/[^\u0590-\u05FF]*\d[^\u0590-\u05FF]*/g, m => { const l = m.match(/^[\s:,.]*/)[0], r = m.match(/[\s:,.]*$/)[0], core = m.slice(l.length, m.length - r.length); return core ? `${l}<tspan direction="ltr" style="unicode-bidi:isolate">${core}</tspan>${r}` : m; }) : s}</text>`; };
const vl = (x1, y1, x2, y2, o = {}) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${o.c || 'var(--muted)'}" stroke-width="${o.w || 2}" ${o.dash ? 'stroke-dasharray="6 6"' : ''} ${o.draw ? 'class="vdraw" pathLength="1"' : ''}/>`;
const vp = (d, o = {}) => `<path d="${d}" fill="${o.fill || 'none'}" stroke="${o.c || 'var(--accent)'}" stroke-width="${o.w || 3}" ${o.draw !== false ? 'class="vdraw" pathLength="1"' : ''} ${o.op ? `fill-opacity="${o.op}"` : ''}/>`;
const vdot = (x, y, o = {}) => `<circle cx="${x}" cy="${y}" r="${o.r || 7}" fill="${o.c || 'var(--ink)'}"/>`;
const vbox = (x, y, w, h, o = {}) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${o.rx ?? 6}" fill="${o.fill || 'var(--sunk)'}" stroke="${o.c || 'none'}"/>`;
const pathOf = pts => 'M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
const axes = (xl, yl) => vl(70, 310, 600, 310) + vl(70, 310, 70, 40) + vt(600, 335, xl, {size: 15, fill: 'var(--muted)', a: 'end'}) + vt(78, 36, yl, {size: 15, fill: 'var(--muted)', a: 'start'});
const timeline = n => { let s = vl(80, 250, 580, 250, {w: 3}); for (let i = 0; i <= n; i++) { const x = 80 + i * 500 / n; s += vl(x, 242, x, 258, {w: 3}) + vt(x, 285, i === 0 ? 'היום' : 'שנה ' + i, {size: 15, fill: 'var(--muted)'}); } return s; };
const bell = (x0, x1, base, h, from = -3.4, to = 3.4) => { const pts = []; for (let z = from; z <= to + 1e-9; z += 0.05) pts.push([x0 + (z + 3.4) / 6.8 * (x1 - x0), base - h * Math.exp(-z * z / 2)]); return pts; };
const shade = (x0, x1, base, h, a, b) => { const p = bell(x0, x1, base, h, a, b); return pathOf([[p[0][0], base], ...p, [p[p.length - 1][0], base]]) + ' Z'; };

// ---------- practice ----------
function qBlock(q, chosen, reveal, num) {
  const right = Array.isArray(q.a) ? q.a.map(i => HEB[i]).join(' או ') : HEB[q.a];
  return `<div class="qtext">${num ? `<span class="qn num">${num}.</span> ` : ''}${ltr(q.q)}</div>
  <div class="opts">${q.o.map((o, i) => {
    let c = ''; if (reveal) { if (isRight(q, i)) c = 'right'; else if (i === chosen) c = 'wrong'; } else if (i === chosen) c = 'sel';
    return `<button class="opt ${c}" data-opt="${i}" ${reveal ? 'disabled' : ''}><span class="k">${HEB[i]}</span><span>${o}</span></button>`;
  }).join('')}</div>
  ${reveal ? `<div class="expl">${verdict(q, chosen, right)}${q.e}</div>` : ''}`;
}
// the opening of the explanation: right / wrong, and if wrong, what mistake leads to the option that was chosen
function verdict(q, chosen, right) {
  if (chosen == null) return `<p class="vd"><b class="no">לא נבחרה תשובה.</b> התשובה הנכונה היא ${right}. הנה הפתרון המלא:</p>`;
  if (isRight(q, chosen)) return `<p class="vd"><b class="ok">נכון!</b> כדי לוודא שזה לא היה ניחוש, עברו על הדרך:</p>`;
  const why = q.w && q.w[chosen];
  return `<p class="vd"><b class="no">לא נכון.</b> בחרת ${HEB[chosen]}, והתשובה הנכונה היא ${right}.</p>` +
    (why ? `<div class="whywrong"><b>מאיפה הגיעה התשובה ${HEB[chosen]}?</b> ${why}</div>` : `<div class="whywrong"><b>על התשובה ${HEB[chosen]}:</b> היא לא מתקבלת מהדרך הנכונה. השוו את החישוב שלכם לשלבים שבפתרון וחפשו איפה הדרכים נפרדות.</div>`);
}
function selLabel(sel) {
  if (sel === 'mix') return 'כל הנושאים'; if (sel === 'weak') return 'נקודות חלשות'; if (sel === 'mistakes') return 'הטעויות שלי';
  if (/^ch\d+$/.test(sel)) { const c = CHAPTERS[+sel.slice(2) - 1]; return `פרק ${c.n}: ${c.title}`; }
  if (/^qb\d$/.test(sel)) return `ספר החזרה: ${QBOOK[+sel[2] - 1].title}`;
  if (/^twin:\d+$/.test(sel)) { const i = +sel.split(':')[1]; return `כמו שאלה ${i + 1} במבחן: ${EXAM_META[i].focus}`; }
  return T[sel] ? T[sel].title : '';
}
function vPractice(m) {
  if (!P) P = {sel: 'mix', right: 0, total: 0, q: null};
  if (!P.q) newQ();
  const isCh = !['mix', 'weak', 'mistakes'].includes(P.sel);
  m.innerHTML = `<header class="page"><h2>תרגול</h2><p>עונים על שאלה ורואים מיד את ההסבר. בשאלות החישוביות המספרים משתנים בכל פעם.</p></header>
  <div class="pbar">
    <div class="seg" role="group" aria-label="סוג תרגול">${[['mix', 'כל הנושאים'], ['weak', 'נקודות חלשות'], ['mistakes', `הטעויות שלי${S.mistakes.length ? ` (${S.mistakes.length})` : ''}`]].map(([k, l]) => `<button data-pick="${k}" aria-pressed="${P.sel === k}">${l}</button>`).join('')}</div>
    <select id="chSel" aria-label="תרגול לפי פרק"><option value="">${isCh ? selLabel(P.sel) : 'לפי פרק…'}</option>${CHAPTERS.map(c => `<option value="ch${c.n}">פרק ${c.n}: ${c.title}</option>`).join('')}<optgroup label="כמו שאלות המבחן 09/2025">${EXAM_META.map((x, i) => `<option value="twin:${i}">שאלה ${i + 1}: ${x.focus}</option>`).join('')}</optgroup><optgroup label="הרחבה">${EXTRA_TOPICS.map(t => `<option value="${t}">${T[t].short}</option>`).join('')}</optgroup></select>
    <span class="score num">${P.total ? `${P.right} מתוך ${P.total}` : ''}</span>
  </div>
  <div id="qwrap"></div>
  ${S.mistakes.length ? `<p class="note"><a href="#" data-go="mistakes">לרשימת כל הטעויות (${S.mistakes.length})</a></p>` : ''}`;
  m.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => { P = {sel: b.dataset.pick, right: 0, total: 0, q: null}; render(); });
  $('#chSel').onchange = e => { if (e.target.value) { P = {sel: e.target.value, right: 0, total: 0, q: null}; render(); } };
  drawQ();
}
function newQ() {
  P.answered = undefined;
  if (P.sel === 'mistakes') {
    if (!S.mistakes.length) { P.q = null; return; }
    const mk = pick(S.mistakes); P.q = prep({id: mk.id, t: mk.t, q: mk.q, e: mk.e, o: mk.o, a: mk.a, fixed: true}); P.fromMistakes = true; return;
  }
  P.fromMistakes = false;
  if (/^twin:\d+$/.test(P.sel)) { P.q = twinQ(+P.sel.split(':')[1]); return; }
  const t = P.sel === 'mix' ? pickBookTopic() : P.sel === 'weak' ? weakTopic() : /^ch\d+$/.test(P.sel) ? pick(CHAPTERS[+P.sel.slice(2) - 1].topics) : /^qb\d$/.test(P.sel) ? pick(QBOOK[+P.sel[2] - 1].topics) : P.sel;
  P.q = drawFor(t, P.q && P.q.id);
}
function drawQ() {
  const w = $('#qwrap');
  if (!P.q) { w.innerHTML = `<div class="empty">אין טעויות לתרגל. כל תשובה שגויה תישמר כאן אוטומטית, יחד עם ההסבר.</div>`; return; }
  const q = P.q, t = T[q.t];
  w.innerHTML = `<div class="qcard"><div class="qhead">${chipOf(t)}<span class="note">${t.short}</span><button class="btn ghost sm" data-lesson="${q.t}">לשיעור</button></div>
  ${qBlock(q, P.answered, P.answered !== undefined)}
  ${P.answered !== undefined ? `<div class="row"><button class="btn primary" id="nextQ">לשאלה הבאה</button></div>` : ''}</div>`;
  w.querySelectorAll('[data-opt]').forEach(b => b.onclick = () => answer(+b.dataset.opt));
  const n = $('#nextQ'); if (n) { n.onclick = () => { newQ(); drawQ(); }; n.focus({preventScroll: true}); }
}
function answer(i) {
  if (P.answered !== undefined) return;
  const q = P.q, ok = isRight(q, i);
  P.answered = i; P.total++; if (ok) P.right++;
  record(q.t, ok); if (q.id) S.seen[q.id] = true;
  if (ok && P.fromMistakes) dropMistake(q);
  if (!ok) addMistake(q, i);
  save();
  const sc = $('.score'); if (sc) sc.textContent = `${P.right} מתוך ${P.total}`;
  const mb = document.querySelector('[data-pick="mistakes"]'); if (mb) mb.textContent = `הטעויות שלי${S.mistakes.length ? ` (${S.mistakes.length})` : ''}`;
  drawQ();
}

// ---------- exams ----------
function buildExam(n) { // questions per chapter in proportion to the chapter's weight
  const tot = CHAPTERS.reduce((a, c) => a + c.len, 0);
  const cnt = CHAPTERS.map(c => Math.max(1, Math.floor(n * c.len / tot)));
  while (cnt.reduce((a, b) => a + b) > n) { let bi = -1, bv = Infinity; CHAPTERS.forEach((c, i) => { const gap = n * c.len / tot - cnt[i]; if (cnt[i] > 0 && gap < bv) { bv = gap; bi = i; } }); cnt[bi]--; }

   <div class="panel"><h4>ערך עתידי וערך נוכחי</h4><div class="fields" style="margin-top:10px">
    <label class="field">סכום<input id="tv_a" type="number" value="10000"></label><label class="field">ריבית %<input id="tv_r" type="number" value="5" step="0.1"></label>
    <label class="field">תקופות<input id="tv_n" type="number" min="0" step="1" value="3"></label><label class="field">תשלום תקופתי<input id="tv_c" type="number" value="0"></label></div>
    <div class="out" id="tv_o"></div></div>
   <div class="panel"><h4>הלוואה: שפיצר מול קרן שווה</h4><div class="fields" style="margin-top:10px">
    <label class="field">סכום<input id="ln_a" type="number" value="100000"></label><label class="field">ריבית לתקופה %<input id="ln_r" type="number" value="6" step="0.1"></label>
    <label class="field">תקופות<input id="ln_n" type="number" min="1" step="1" value="5"></label></div><div class="out" id="ln_o"></div></div>
   <div class="panel"><h4>התפלגות נורמלית</h4><div class="fields" style="margin-top:10px">
    <label class="field">μ<input id="nm_m" type="number" value="0"></label><label class="field">σ<input id="nm_s" type="number" value="1"></label>
    <label class="field">x<input id="nm_x" type="number" value="1.96" step="0.01"></label></div><div class="out" id="nm_o"></div></div>
   <div class="panel"><h4>NPV ו־IRR</h4><div class="fields" style="margin-top:10px">
    <label class="field" style="grid-column:1/-1">תזרימי המזומנים מהיום והלאה, מופרדים בפסיקים (השקעה במינוס)<input id="np_cf" type="text" value="-1000, 600, 600"></label>
    <label class="field">מחיר ההון %<input id="np_r" type="number" value="10" step="0.1"></label></div><div class="out" id="np_o"></div></div>
   <div class="panel"><h4>אג״ח: מחיר ומח״מ</h4><div class="fields" style="margin-top:10px">
    <label class="field">קופון %<input id="bd_c" type="number" value="5" step="0.1"></label><label class="field">תשואה לפדיון %<input id="bd_y" type="number" value="6" step="0.1"></label>
    <label class="field">שנים<input id="bd_n" type="number" min="1" step="1" value="3"></label></div><div class="out" id="bd_o"></div></div>
  </div>`;
  const v = id => parseFloat($('#' + id).value);
  const N = (x, d = 2) => `<bdi dir="ltr">${isFinite(x) ? nf(x, d) : '—'}</bdi>`, Pc = x => `<bdi dir="ltr">${isFinite(x) ? pct(x, 2) : '—'}</bdi>`;
  const L2 = t => `<bdi dir="ltr">${t}</bdi>`, how = t => `<span class="how">${t}</span>`;
  const calc = () => {
    const a = v('tv_a'), r = v('tv_r') / 100, n = Math.max(0, Math.round(v('tv_n'))), c = v('tv_c') || 0;
    const ann = r ? (1 - (1 + r) ** -n) / r : n, annF = r ? ((1 + r) ** n - 1) / r : n;
    $('#tv_o').innerHTML = `ערך עתידי: ${N(a * (1 + r) ** n + c * annF)}<br>ערך נוכחי: ${N(a / (1 + r) ** n + c * ann)}${how(`סכום בודד: ${L2('FV = PV·(1 + r)<sup>n</sup>')}<br>תשלום קבוע: ${L2('PV = C·[1 − (1 + r)<sup>−n</sup>]/r')}`)}`;
    const L = v('ln_a'), lr = v('ln_r') / 100, ln = Math.max(1, Math.round(v('ln_n'))), pmt = lr ? L * lr / (1 - (1 + lr) ** -ln) : L / ln;
    $('#ln_o').innerHTML = `<b>שפיצר:</b> תשלום קבוע ${N(pmt)}, סך הריבית ${N(pmt * ln - L)}<br><b>קרן שווה:</b> תשלום ראשון ${N(L / ln + L * lr)}, תשלום אחרון ${N(L / ln * (1 + lr))}, סך הריבית ${N(L * lr * (ln + 1) / 2)}${how(`שפיצר: ${L2('PMT = PV·r/[1 − (1 + r)<sup>−n</sup>]')}<br>קרן שווה: קרן קבועה ${L2('PV/n')}, ועליה ריבית על היתרה.`)}`;
    const sd = v('nm_s');
    if (!(sd > 0)) $('#nm_o').innerHTML = 'סטיית התקן חייבת להיות חיובית.';
    else { const z = (v('nm_x') - v('nm_m')) / sd; $('#nm_o').innerHTML = `ציון התקן: ${L2(`z = ${nf(z, 4)}`)}<br>מתחת ל־x: ${L2(`P(X &lt; x) = ${nf(Phi(z), 4)}`)}<br>מעל x: ${L2(`P(X &gt; x) = ${nf(1 - Phi(z), 4)}`)}${how(`${L2('z = (x − μ)/σ')}, ואת ההסתברות קוראים בטבלה הנורמלית.`)}`; }
    const parts = $('#np_cf').value.split(/[,;\s]+/).filter(Boolean), cf = parts.map(Number), nr = v('np_r') / 100;
    if (cf.some(x => isNaN(x)) || cf.length < 2) $('#np_o').innerHTML = 'יש להזין לפחות שני מספרים מופרדים בפסיק, למשל: <bdi dir="ltr">-1000, 600, 600</bdi>';
    else {
      const npv = rr => cf.reduce((s, c, t) => s + c / (1 + rr) ** t, 0);
      let lo = -0.99, hi = 10, irr = null;
      if (npv(lo) * npv(hi) < 0) { for (let k = 0; k < 200; k++) { const mid = (lo + hi) / 2; if (npv(lo) * npv(mid) <= 0) hi = mid; else lo = mid; } irr = (lo + hi) / 2; }
      $('#np_o').innerHTML = `ערך נוכחי נקי: ${L2(`NPV = ${nf(npv(nr), 2)}`)}<br>שיעור תשואה פנימי: ${irr === null ? 'לא נמצא' : L2(`IRR = ${pct(irr, 2)}`)}${how(`מהוונים כל תזרים לפי השנה שלו ומחברים:<br>${L2('NPV = Σ CF<sub>t</sub>/(1 + r)<sup>t</sup>')}<br>ה־IRR הוא הריבית שבה NPV = 0.`)}`;
    }
    const bc = v('bd_c'), by = v('bd_y') / 100, bn = Math.max(1, Math.round(v('bd_n'))); let P = 0, W = 0;
    for (let t = 1; t <= bn; t++) { const cfv = bc + (t === bn ? 100 : 0), pv = cfv / (1 + by) ** t; P += pv; W += t * pv; }
    $('#bd_o').innerHTML = `מחיר ל־100 ע״נ: ${N(P, 3)} · תשואה שוטפת: ${Pc(bc / P)}<br>מח״מ מקולי: ${N(W / P, 3)} שנים · מח״מ מתוקן: ${N(W / P / (1 + by), 3)}${how(`מחיר: היוון הקופונים והקרן בתשואה לפדיון. מח״מ: ממוצע הזמנים, משוקלל בערך הנוכחי של כל תזרים. מח״מ מתוקן: ${L2('D/(1 + y)')}`)}`;
  };
  m.querySelectorAll('input').forEach(i => i.oninput = calc); calc();
}

// ---------- question-book tracker ----------
function vBook(m) {
  const totals = () => QBOOK.reduce((a, c) => { const x = S.book[c.n] || {}; return [a[0] + (+x.solved || 0), a[1] + Math.min(+x.correct || 0, +x.solved || 0)]; }, [0, 0]);
  const sumText = () => { const [s, c] = totals(); return s ? `נפתרו ${s} שאלות, ${Math.round(c / s * 100)}% נכונות` : 'עוד לא עודכן'; };
  m.innerHTML = `<p class="note">אחרי כל ישיבה על ספר החזרה כדאי לעדכן כמה שאלות נפתרו, כמה מהן נכונות, ומה המספרים של השאלות שצריך לחזור אליהן. <b id="bkSum">${sumText()}</b></p>
  <div class="booklist">${QBOOK.map(c => { const b = S.book[c.n] || {}; return `<div class="bookrow">
    <div class="bk-t"><b>פרק ${c.n} · ${c.title}</b><span class="note">עמ׳ ${ltr(c.pages)}</span></div>
    <label class="field">נפתרו<input type="number" min="0" inputmode="numeric" data-bk="${c.n}" data-f="solved" value="${b.solved || ''}"></label>
    <label class="field">נכונות<input type="number" min="0" inputmode="numeric" data-bk="${c.n}" data-f="correct" value="${b.correct || ''}"></label>
    <label class="field bk-w">לחזור לשאלות<input type="text" data-bk="${c.n}" data-f="wrong" placeholder="3, 7, 12" value="${esc(b.wrong || '')}"></label>
  </div>`; }).join('')}</div>`;
  m.querySelectorAll('[data-bk]').forEach(inp => inp.oninput = () => {
    const b = S.book[inp.dataset.bk] = S.book[inp.dataset.bk] || {};
    b[inp.dataset.f] = inp.value; save(); const el = document.getElementById('bkSum'); if (el) el.textContent = sumText();
  });
}

// ---------- global events ----------
document.addEventListener('click', e => {
  const vd = e.target.closest('[data-video]');
  if (vd) { e.preventDefault(); stopVideo(); view = 'videos'; nav(); render({video: vd.dataset.video}); window.scrollTo(0, 0); return; }
  const g = e.target.closest('[data-go]'), l = e.target.closest('[data-lesson]'), p = e.target.closest('[data-practice]'), pm = e.target.closest('[data-practice-mode]');
  if (g) { e.preventDefault(); go(g.dataset.go); }
  else if (l) { e.preventDefault(); go('learn', {topic: l.dataset.lesson}); }
  else if (p) { e.preventDefault(); P = {sel: p.dataset.practice, right: 0, total: 0, q: null}; go('practice'); }
  else if (pm) { e.preventDefault(); P = {sel: pm.dataset.practiceMode, right: 0, total: 0, q: null}; go('practice'); }
});
document.addEventListener('keydown', e => {
  if (e.target.matches('input, select, textarea')) return;
  const k = e.key;
  if (view === 'practice' && P && P.q) {
    if (/^[1-5]$/.test(k) && +k <= P.q.o.length && P.answered === undefined) answer(+k - 1);
    else if (k === 'Enter' && P.answered !== undefined) { e.preventDefault(); newQ(); drawQ(); }
  } else if (view === 'exam' && X && X.running && /^[1-5]$/.test(k) && +k <= X.qs[X.cur].o.length) { X.ans[X.cur] = +k - 1; render(); }
});
function setHdr() { const h = document.querySelector('.top'); if (h) document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px'); }
window.addEventListener('resize', setHdr);
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h !== view && ROUTES.includes(h)) go(h); });
nav(); render(); setHdr(); fixBidi(document.getElementById('main'));
</script>
