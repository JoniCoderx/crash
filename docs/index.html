<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="מערכת לימוד למבחן סטטיסטיקה ומימון של רשות ניירות ערך: שיעורים מאפס, סרטוני הסבר, תרגול עם פתרון מלא והמבחן האמיתי 09/2025.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='2' y='2' width='60' height='60' rx='18' fill='%230b4350'/%3E%3Cpath d='M10 46 C19 46 22 18 32 18 C42 18 45 46 54 46' fill='none' stroke='%23e7c37a' stroke-width='3.6' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='18' r='3.6' fill='%23fff'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0b4350">
</head><body>
<title>המרכז להצלחה על שם אריאל סיילס</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bellefair&family=Heebo:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Sigma. Calm study app: one reading column, five tabs, petrol + brass. Display: Bellefair. Text: Heebo. Numbers: Plex Mono. */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e9eeec; --ink:#0f2a33; --muted:#5a6d73; --line:#d7e0dd;
  --accent:#0c5463; --accent-ink:#ffffff; --accent-soft:#e1eef1; --gold:#9c6b1c; --gold-soft:#f6ecd8;
  --good:#1b7a3d; --good-soft:#e0f1e6; --bad:#b3261e; --bad-soft:#fae3e0;
  --display:"Bellefair", "Frank Ruhl Libre", "David", Georgia, serif;
  --body:"Heebo", "Segoe UI", "Arial Hebrew", Arial, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0b1619; --surface:#112025; --sunk:#0a1417; --ink:#e3ecee; --muted:#95a8ad; --line:#21363c;
  --accent:#62bccb; --accent-ink:#04222a; --accent-soft:#12323b; --gold:#d9ab5a; --gold-soft:#372a13;
  --good:#5cc483; --good-soft:#123222; --bad:#f07b70; --bad-soft:#3a1714; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1619; --surface:#112025; --sunk:#0a1417; --ink:#e3ecee; --muted:#95a8ad; --line:#21363c;
  --accent:#62bccb; --accent-ink:#04222a; --accent-soft:#12323b; --gold:#d9ab5a; --gold-soft:#372a13;
  --good:#5cc483; --good-soft:#123222; --bad:#f07b70; --bad-soft:#3a1714; color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.75;direction:rtl;text-align:right;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2{font-family:var(--display);font-weight:400;line-height:1.15;text-wrap:balance;margin:0}
h3,h4{font-family:var(--body);font-weight:700;line-height:1.35;text-wrap:balance;margin:0}
h2{font-size:2.1rem} h3{font-size:1.2rem} h4{font-size:1.05rem}
p{margin:0}
b,strong{font-weight:700}
a{color:var(--accent);text-underline-offset:3px}
bdi{unicode-bidi:isolate}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.note{color:var(--muted);font-size:.9rem}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.02em}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.between{justify-content:space-between}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:960px;margin:0 auto;padding:12px 16px 0;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:12px}
.brand .logo{width:42px;height:42px;flex:none}
.brand .names{display:flex;flex-direction:column;min-width:0}
.brand h1{font-size:1.75rem;line-height:1.05}
.brand .sub{color:var(--muted);font-size:.82rem;margin-top:3px}
.brand .cd{margin-inline-start:auto;font-size:.8rem;font-weight:600;color:var(--gold);background:var(--gold-soft);padding:3px 12px;border-radius:999px;white-space:nowrap}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{flex:1 0 auto;background:none;border:0;border-bottom:3px solid transparent;padding:10px 10px 9px;white-space:nowrap;color:var(--muted);font-weight:500;font-size:.98rem}
nav.tabs button[aria-current="true"]{color:var(--ink);font-weight:700;border-color:var(--gold)}

/* layout */
main{max-width:960px;margin:0 auto;padding-inline:16px;padding-block:28px 72px;display:flex;flex-direction:column;gap:28px}
header.page{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
header.page p{color:var(--muted);max-width:62ch}
.sec-title{margin-bottom:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.crumbs{display:flex;gap:8px;font-size:.9rem;color:var(--muted)}
.crumbs a{text-decoration:none;font-weight:600}

/* buttons & fields */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 18px;font-weight:600;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding-inline:8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 12px;font-size:.88rem;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:default}
.field{display:flex;flex-direction:column;gap:4px;font-size:.88rem;color:var(--muted);font-weight:500}
.field input,select{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:100%;font-size:1rem}
input[type="number"],input[type="date"]{font-family:var(--mono)}
.check{display:inline-flex;gap:8px;align-items:center;font-size:.95rem;color:var(--muted)}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--gold-soft);padding:10px 14px;border-radius:10px}
details.more{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0 18px}
details.more summary{cursor:pointer;padding:14px 0;font-weight:600;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.more summary::-webkit-details-marker{display:none}
details.more summary::after{content:"+";font-size:1.3rem;color:var(--muted);font-weight:400}
details.more[open] summary::after{content:"−"}
details.more[open]{padding-bottom:18px}
.empty{color:var(--muted);background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);padding:28px;text-align:center}

/* onboarding */
.welcome{background:linear-gradient(160deg,#0f6476,#082a33);color:#fff;border-radius:20px;padding:clamp(22px,5vw,40px);display:flex;flex-direction:column;gap:14px}
.welcome .eyebrow{color:rgba(255,255,255,.75)}
.welcome h2{font-size:clamp(2rem,6vw,2.7rem)}
.welcome p{max-width:52ch;color:rgba(255,255,255,.88)}
.wl-top{display:flex;align-items:center;gap:10px}.wl-logo{width:34px;height:34px}
.wl-feats{list-style:none;margin:4px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.wl-feats li{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.wl-feats b{color:#f0cd87;font-size:1.02rem}.wl-feats span{color:rgba(255,255,255,.85);font-size:.92rem;line-height:1.6}
.wl-facts{display:flex;flex-wrap:wrap;gap:8px}.wl-facts span{font-size:.85rem;padding:4px 12px;border-radius:999px;background:rgba(240,205,135,.16);color:#f6dfae}
.wl-level{border:0;padding:0;margin:0;flex:1 1 100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.wl-level legend{color:rgba(255,255,255,.85);font-size:.9rem;margin-bottom:6px;padding:0}
.wl-level label{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:10px 12px;cursor:pointer}
.wl-level label:has(input:checked){border-color:#f0cd87;background:rgba(240,205,135,.14)}
.wl-level input{accent-color:#c8963f;margin-top:5px}.wl-level span{display:flex;flex-direction:column;font-size:.86rem;color:rgba(255,255,255,.8)}.wl-level span b{color:#fff;font-size:.98rem}
.wl-note{font-size:.82rem;color:rgba(255,255,255,.65)!important;margin:0}
.onb{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-top:6px}
.onb .field{color:rgba(255,255,255,.85);flex:1 1 180px}
.onb input{background:#fff;color:#0f2a33;border:0}
.onb .btn{background:#c8963f;border-color:#c8963f;color:#1d1406;padding:10px 26px}

/* home */
.hello h2{font-size:clamp(2rem,6vw,2.6rem)}
.hello p{color:var(--muted);margin-top:4px}
.today{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--gold);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:12px}
.today h3{font-size:1.45rem}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.steps li{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--line)}
.steps li:first-child{border-top:0}
.steps .acts{display:flex;gap:6px;flex-wrap:wrap}
.today .todo{font-weight:500}
.today .book{color:var(--muted);font-size:.92rem}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.stats div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px}
.stats b{font-size:1.45rem;font-weight:500}
.stats span{font-size:.8rem;color:var(--muted)}
@media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
.notice{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--bad-soft);color:var(--ink);border-radius:12px;padding:12px 16px}
ol.plan{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
ol.plan li{display:grid;grid-template-columns:2.2rem 1fr auto auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
ol.plan li:first-child{border-top:0}
ol.plan .pd{color:var(--muted);font-size:.85rem}
ol.plan .pdate{color:var(--muted);font-size:.82rem;white-space:nowrap}
ol.plan .ok{color:var(--good);font-weight:700}
ol.plan li.now{background:var(--gold-soft)}
ol.plan li.now .pt{font-weight:700}
ol.plan li.done .pt{color:var(--muted)}
.mastery{display:grid;grid-template-columns:1fr 1fr;gap:6px 28px}
.mastery .eyebrow{margin-top:10px}
@media (max-width:640px){.mastery{grid-template-columns:1fr}}
.mrow{display:grid;grid-template-columns:minmax(0,8.5rem) 1fr 3rem;gap:10px;align-items:center;padding:6px 0;background:none;border:0;width:100%;text-align:start}
.mrow.static{cursor:default}
.mname{font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;display:block}
.bar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar i.lo{background:var(--bad)} .bar i.mid{background:var(--gold)}
.mpct{font-family:var(--mono);font-size:.82rem;color:var(--muted);text-align:left}
.settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:10px}
@media (max-width:480px){.settings{grid-template-columns:1fr}}
.booklist{display:flex;flex-direction:column;margin-top:8px}
.bookrow{display:grid;grid-template-columns:1.6fr .6fr .6fr 1fr;gap:10px;align-items:end;padding:12px 0;border-top:1px solid var(--line)}
.bk-t{display:flex;flex-direction:column}
@media (max-width:640px){.bookrow{grid-template-columns:1fr 1fr}.bk-t,.bk-w{grid-column:1/-1}}

/* learn */
.vrow{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.vcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;display:flex;flex-direction:column;gap:8px;text-align:start;scroll-snap-align:start}
.vcard:hover{border-color:var(--accent)}
.vcard .vt{font-weight:600;padding:0 4px 4px;font-size:.95rem}
.vcard .vdur{padding:0 4px 4px;margin-top:-6px;font-size:.8rem;direction:rtl}
.vthumb{position:relative;display:block;border-radius:8px;overflow:hidden;background:var(--bg);aspect-ratio:16/9}
.vthumb svg{width:100%;height:100%;display:block;opacity:.7}
.vplayico{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:1.05rem;padding-inline-start:3px}
.chapter{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.ch-h{display:flex;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--sunk);font-size:.88rem;font-weight:700}
.lrow{display:grid;grid-template-columns:12px 1fr 1.4rem 3rem;gap:12px;align-items:center;width:100%;background:none;border:0;border-top:1px solid var(--line);padding:12px 16px;text-align:start;font-size:1rem}
.ch-h + .lrow{border-top:0}
.lrow:hover .lt{color:var(--accent)}
.lrow .dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--line)}
.lrow .dot.on{background:var(--good);border-color:var(--good)}
.lrow .vid{color:var(--gold);font-size:.8rem}
.lrow .lp{font-size:.82rem;color:var(--muted);text-align:left}
.glsearch{max-width:280px;margin-bottom:12px}
.gloss{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:4px 24px}
.gloss div{padding:6px 0;border-bottom:1px solid var(--line);font-size:.95rem}

/* lesson */
article.lesson{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,4vw,40px);display:flex;flex-direction:column;gap:14px}
article.lesson h2{font-size:clamp(2rem,6vw,2.6rem)}
article.lesson > h4{font-size:1.15rem;margin-top:14px}
article.lesson p,article.lesson li{max-width:66ch}
article.lesson ul,article.lesson ol{margin:0;padding-inline-start:22px}
article.lesson li{margin:4px 0}
.zero{background:var(--accent-soft);border-radius:var(--r);padding:18px 20px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.zero .why{font-size:1.06rem;font-weight:500}
.zcols{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%}
.zcols h4{margin-bottom:6px;font-size:.95rem;color:var(--accent)}
.zero dl{margin:0;display:flex;flex-direction:column;gap:2px}
.zero dt{font-weight:700}
.zero dd{margin:0 0 6px;color:var(--muted);font-size:.95rem}
.zero ol{margin:0;padding-inline-start:20px}
@media (max-width:640px){.zcols{grid-template-columns:1fr}}
.fx{font-family:var(--mono);font-size:.92rem;background:var(--sunk);border-inline-start:3px solid var(--gold);padding:10px 14px;border-radius:6px;direction:ltr;text-align:left;overflow-x:auto;line-height:1.85;unicode-bidi:isolate}
span.fx{display:inline;padding:2px 6px;border:0;line-height:1.6}
.ex,.plain,.trap{border-radius:12px;padding:14px 18px;line-height:1.85}
.ex{background:var(--sunk)}
.plain{background:var(--gold-soft)}
.trap{background:var(--bad-soft)}
.trap ul{margin:6px 0 0}
.tbl-wrap{overflow-x:auto;background:linear-gradient(to left,var(--surface) 30%,transparent),linear-gradient(to left,transparent,var(--surface) 70%) 100% 0,radial-gradient(farthest-side at 0 50%,rgb(0 0 0/.14),transparent),radial-gradient(farthest-side at 100% 50%,rgb(0 0 0/.14),transparent) 100% 0;background-repeat:no-repeat;background-size:40px 100%,40px 100%,14px 100%,14px 100%;background-attachment:local,local,scroll,scroll}
table.mini{border-collapse:collapse;font-size:.92rem}
table.mini th,table.mini td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.mini td{font-family:var(--mono);direction:ltr;unicode-bidi:isolate;white-space:nowrap}
table.mini th{background:var(--sunk);font-weight:600}
.endrow{margin-top:10px}
.lesson-nav{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding-top:14px}

/* questions */
.qcard{scroll-margin-top:calc(var(--hdr,150px) + 16px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:14px}
.qhead{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.qhead .btn{margin-inline-start:auto}
.qtext{font-size:1.1rem;font-weight:500;line-height:1.8}
.qn{color:var(--muted)}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:start;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 16px;line-height:1.6}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt .k{font-weight:700;color:var(--muted);min-width:1.1em}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.expl{border-radius:12px;padding:14px 16px;background:var(--sunk);line-height:1.85}
.expl b.ok{color:var(--good)} .expl b.no{color:var(--bad)}
.expl p{margin:0 0 8px}.expl .vd{font-size:1.02rem}
.out bdi{white-space:nowrap}.out{font-family:var(--body)}.out bdi{font-family:var(--mono);font-size:.94em}
.out .how{display:block;margin-top:8px;font-size:.85rem;color:var(--muted);line-height:1.7}
.whywrong{background:var(--bad-soft,#fbecea);border-inline-start:4px solid var(--bad);border-radius:8px;padding:10px 12px;margin:0 0 12px}
.sol{display:flex;flex-direction:column;gap:2px}.sol>p>b:first-child{color:var(--accent)}
.ssteps{margin:4px 0 8px;padding-inline-start:1.4em;display:flex;flex-direction:column;gap:6px}.ssteps li::marker{color:var(--accent);font-weight:700}
.sres{background:var(--good-soft,#e6f4ec);border-radius:8px;padding:8px 12px}.sres b{color:var(--good)!important}
.stip{background:var(--gold-soft);border-radius:8px;padding:8px 12px}.stip b{color:var(--gold)!important}
.mq{display:flex;flex-direction:column;gap:14px}
.pbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pbar select{width:auto;max-width:100%}
.pbar .score{margin-inline-start:auto;color:var(--muted);font-size:.9rem}
.seg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:2px}
@media (max-width:560px){.seg{display:grid;width:100%}.seg button{padding-inline:6px;font-size:.9rem}.pbar select{flex:1}}
.seg button{border:0;background:none;border-radius:9px;padding:7px 14px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* exams */
.examgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media (max-width:900px){.examgrid{grid-template-columns:1fr 1fr}}
.examgrid .panel{display:flex;flex-direction:column;gap:10px}
.examgrid .feature{border-top:4px solid var(--gold)}
@media (max-width:640px){.examgrid{grid-template-columns:1fr}}
.exam-bar{display:flex;gap:12px;align-items:center;justify-content:space-between;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--hdr,0px));z-index:4;background:var(--bg);padding-block:8px}
.timer{font-size:1.3rem;font-weight:500}
.timer.low{color:var(--bad)}
.qgrid{display:flex;flex-wrap:wrap;gap:6px}

<script>
const TOPICS = [
{id:'s1', area:'stat', title:'סטטיסטיקה תיאורית', short:'תיאורית',
lesson:`
<p>סטטיסטיקה תיאורית מסכמת אוסף נתונים בכמה מספרים בודדים. היא עונה על שתי שאלות: היכן נמצא מרכז הנתונים, ועד כמה הם מפוזרים סביבו.</p>
<h4>מדדי מרכז</h4>
<ul>
<li><b>ממוצע</b>: סכום התצפיות חלקי מספר התצפיות. הממוצע רגיש לערכים קיצוניים: <span class="fx" dir="ltr">x̄ = Σx / n</span></li>
<li><b>חציון</b>: הערך האמצעי לאחר מיון הנתונים. כשמספר התצפיות זוגי, החציון הוא הממוצע של שני הערכים האמצעיים. ערכים קיצוניים אינם משפיעים עליו.</li>
<li><b>שכיח</b>: הערך שמופיע בנתונים הכי הרבה פעמים.</li>
</ul>
<h4>מדדי פיזור</h4>
<div class="fx" dir="ltr">Var(X) = Σ P<sub>i</sub>·(X<sub>i</sub> − X̄)² &nbsp;&nbsp;(sample: P<sub>i</sub> = 1/n)<br>Cov(X,Y) = Σ P<sub>i</sub>·(X<sub>i</sub> − X̄)(Y<sub>i</sub> − Ȳ)<br>CV = σ / μ</div>
<p><b>חשוב למבחן:</b> גם כשמדובר במדגם, דף הנוסחאות הרשמי מחשב את השונות ב<u>חלוקה ב־n</u>, כלומר P<sub>i</sub> = 1/n. בספרי סטטיסטיקה רבים מחלקים ב־(n−1), אבל במבחן הזה לא עושים זאת, אלא אם השאלה מציינת אחרת במפורש.</p>
<h4>טבלת שכיחויות</h4>
<p>כשהנתונים מוצגים בטבלה של שכיחויות יחסיות, ההסתברויות P<sub>i</sub> הן השכיחויות היחסיות, וכל מחלקה מיוצגת על ידי אמצע המחלקה. את צורת ההתפלגות קובעים לפי המקום שבו מרוכז רוב המשקל: אם רוב השכיחות נמצאת בערכים הנמוכים והזנב נמשך לעבר הערכים הגבוהים, ההתפלגות אסימטרית ימנית. כך בדיוק נוסחה שאלה 8 במבחן 09/2025.</p>
<p>סטיית התקן היא השורש של השונות, ולכן היא נמדדת באותן יחידות כמו הנתונים עצמם. מקדם ההשתנות (CV) הוא מדד פיזור יחסי, והוא מאפשר להשוות פיזור בין סדרות שהממוצעים שלהן שונים. במימון הוא מבטא סיכון ליחידת תשואה.</p>
<h4>טרנספורמציה לינארית</h4>
<div class="fx" dir="ltr">Y = a + bX → Ȳ = a + b·x̄ ,&nbsp; σ<sub>Y</sub> = |b|·σ<sub>X</sub> ,&nbsp; σ²<sub>Y</sub> = b²·σ²<sub>X</sub></div>
<p>הוספת קבוע לכל הנתונים מזיזה אותם, אבל אינה משנה את הפיזור. הכפלה בקבוע מכפילה גם את סטיית התקן בערכו המוחלט של הקבוע.</p>
<h4>צורת ההתפלגות</h4>
<p>כשהממוצע גדול מהחציון, להתפלגות יש זנב ארוך ימינה: אסימטריה ימנית (חיובית). כשהממוצע קטן מהחציון, האסימטריה שמאלית (שלילית). בהתפלגות סימטרית הממוצע שווה לחציון.</p>
<div class="ex"><b>דוגמה פתורה.</b> הנתונים: 2, 4, 4, 4, 5, 5, 7, 9.<br>
הממוצע: 40/8 = 5. ריבועי הסטיות מהממוצע: 9, 1, 1, 1, 0, 0, 4, 16, ובסך הכול 32.<br>
השונות לפי דף הנוסחאות (P<sub>i</sub> = 1/8): 32/8 = 4, ולכן σ = 2.<br>
החציון הוא הממוצע של התצפיות ה־4 וה־5: (4+5)/2 = 4.5. השכיח: 4.</div>
<div class="plain"><b>במילים פשוטות:</b> הממוצע מראה היכן נמצא "מרכז הכובד" של הנתונים, וסטיית התקן מראה כמה רחוקות התצפיות מהמרכז, בממוצע. אם כל המשכורות עולות ב־1,000 ₪, גם הממוצע עולה ב־1,000 ₪, אבל הפערים בין העובדים לא משתנים.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחלק ב־(n−1). לפי דף הנוסחאות הרשמי מחלקים ב־n, כלומר P<sub>i</sub> = 1/n.</li>
<li>לחשוב שהוספת קבוע משנה את סטיית התקן. היא לא משנה אותה.</li>
<li>להכפיל את השונות ב־b במקום ב־b².</li>
<li>לשכוח למיין את הנתונים לפני חישוב החציון.</li>
</ul></div>`},

{id:'s2', area:'stat', title:'הסתברות', short:'הסתברות',
lesson:`
<p>הסתברות היא מספר בין 0 ל־1 שמבטא עד כמה סביר שמאורע יתרחש. כמעט כל שאלה במבחן נפתרת בעזרת ארבעה כללים בסיסיים:</p>
<div class="fx" dir="ltr">P(Aᶜ) = 1 − P(A)<br>P(A ∪ B) = P(A) + P(B) − P(A ∩ B)<br>P(A | B) = P(A ∩ B) / P(B)<br>A,B independent ⇔ P(A ∩ B) = P(A)·P(B)</div>
<h4>מאורעות זרים לעומת מאורעות בלתי תלויים</h4>
<p>מאורעות <b>זרים</b> אינם יכולים להתרחש יחד: P(A∩B)=0. מאורעות <b>בלתי תלויים</b> אינם משפיעים זה על זה. שני מאורעות זרים שלכל אחד מהם הסתברות חיובית הם תמיד <u>תלויים</u>: אם A התרחש, ברור ש־B לא התרחש.</p>
<h4>נוסחת ההסתברות השלמה ונוסחת בייס</h4>
<div class="fx" dir="ltr">P(A) = P(A|B)·P(B) + P(A|Bᶜ)·P(Bᶜ)<br>P(B|A) = P(A|B)·P(B) / P(A)</div>
<p>נוסחת בייס "הופכת" הסתברות מותנית: ידועה ההסתברות לסימן בהינתן מצב מסוים, ורוצים לדעת מה ההסתברות למצב בהינתן הסימן. הדרך הבטוחה ביותר היא לבנות עץ הסתברויות.</p>
<h4>קומבינטוריקה</h4>
<div class="fx" dir="ltr">n! ,&nbsp; C(n,k) = n! / (k!·(n−k)!)</div>
<p>הצירוף C(n,k) סופר בכמה דרכים אפשר לבחור k פריטים מתוך n כשהסדר אינו חשוב, למשל 3 מניות מתוך 8.</p>
<div class="ex"><b>דוגמה פתורה (בייס).</b> 1% מהחברות פושטות רגל. מודל דירוג מסמן 90% מהחברות שפושטות רגל, אבל גם 5% מהחברות התקינות.<br>
ההסתברות שחברה תסומן: <span class="fx">0.9·0.01 + 0.05·0.99 = 0.009 + 0.0495 = 0.0585</span><br>
ההסתברות לפשיטת רגל בהינתן סימון: <span class="fx">0.009 / 0.0585 ≈ 15.4%</span><br>
המסקנה: כשהתופעה נדירה, גם מודל טוב מייצר בעיקר אזעקות שווא.</div>
<div class="plain"><b>במילים פשוטות:</b> "בהינתן B" פירושו שמצמצמים את העולם רק למקרים שבהם B התרחש, ושואלים איזה חלק מהם הם גם A.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לבלבל בין P(A|B) לבין P(B|A).</li>
<li>לחבר הסתברויות של מאורעות שאינם זרים בלי לחסר את החיתוך.</li>
<li>לחשוב שמאורעות זרים הם בהכרח בלתי תלויים.</li>
</ul></div>`},

{id:'s3', area:'stat', title:'משתנים מקריים והתפלגות בינומית', short:'משתנים מקריים',
lesson:`
<p>משתנה מקרי הוא תוצאה מספרית של ניסוי מקרי, למשל התשואה של מניה בשנה הבאה.</p>
<h4>תוחלת ושונות</h4>
<div class="fx" dir="ltr">E(X) = Σ x·P(x)<br>V(X) = E(X²) − [E(X)]²<br>E(a + bX) = a + b·E(X) ,&nbsp; V(a + bX) = b²·V(X)</div>
<h4>שני משתנים</h4>
<div class="fx" dir="ltr">Cov(X,Y) = E(XY) − E(X)E(Y)<br>ρ = Cov(X,Y) / (σ<sub>X</sub>·σ<sub>Y</sub>) ,&nbsp; −1 ≤ ρ ≤ 1<br>V(aX + bY) = a²V(X) + b²V(Y) + 2ab·Cov(X,Y)</div>
<p>הנוסחה האחרונה היא הבסיס של כל תורת התיקים: שונות התיק תלויה במתאם בין הנכסים שבו.</p>
<p>מתאם 0 פירושו שאין בין המשתנים קשר <u>לינארי</u>, אבל הם לא בהכרח בלתי תלויים. הכיוון ההפוך נכון תמיד: משתנים בלתי תלויים הם בעלי מתאם 0.</p>
<h4>התפלגות בינומית</h4>
<p>מבצעים n ניסויים בלתי תלויים, ובכל אחד מהם ההסתברות להצלחה היא p. המשתנה X סופר את מספר ההצלחות.</p>
<div class="fx" dir="ltr">P(X = k) = C(n,k)·p<sup>k</sup>·(1−p)<sup>n−k</sup><br>E(X) = np ,&nbsp; V(X) = np(1−p)</div>
<div class="ex"><b>דוגמה פתורה.</b> X מקבל את הערך 10 בהסתברות 0.5, את הערך 0 בהסתברות 0.3 ואת הערך 20− בהסתברות 0.2.<br>
E(X) = 5 + 0 − 4 = 1. E(X²) = 50 + 0 + 80 = 130. V(X) = 130 − 1 = 129, ולכן σ ≈ 11.36.<br>
עבור Y = 3 − 2X מתקבל: E(Y) = 3 − 2 = 1 ו־V(Y) = 4·129 = 516.</div>
<div class="plain"><b>במילים פשוטות:</b> התוחלת היא "הממוצע בטווח הארוך": מה שמתקבל בממוצע אם חוזרים על הניסוי שוב ושוב. השונות מודדת עד כמה התוצאות מתפזרות סביב התוחלת.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לשכוח שהקבוע a והסימן של b אינם משפיעים על השונות, כי b מועלה בריבוע: V(a − bX) = b²V(X).</li>
<li>לשכוח את האיבר 2Cov בשונות של סכום.</li>
<li>לשכוח את מקדם הצירוף C(n,k) בהתפלגות הבינומית.</li>
</ul></div>`},

{id:'s4', area:'stat', title:'ההתפלגות הנורמלית', short:'נורמלית',
lesson:`
<p>ההתפלגות הנורמלית היא "פעמון" סימטרי סביב הממוצע, ולכן הממוצע, החציון והשכיח שלה שווים. כל משתנה נורמלי אפשר להפוך למשתנה נורמלי סטנדרטי (ממוצע 0 וסטיית תקן 1) בעזרת תקנון:</p>
<div class="fx" dir="ltr">Z = (X − μ) / σ ,&nbsp; P(X ≤ x) = Φ(z)</div>
<h4>ערכים שכדאי לזכור בעל פה</h4>
<div class="tbl-wrap"><table class="mini"><tr><th>z</th><td>1</td><td>1.28</td><td>1.645</td><td>1.96</td><td>2</td><td>2.33</td><td>2.576</td></tr>
<tr><th>Φ(z)</th><td>0.8413</td><td>0.90</td><td>0.95</td><td>0.975</td><td>0.9772</td><td>0.99</td><td>0.995</td></tr></table></div>
<p>כלל 68-95-99.7: כ־68% מהתצפיות נמצאות במרחק של עד סטיית תקן אחת מהממוצע, כ־95% במרחק של עד שתי סטיות תקן וכ־99.7% במרחק של עד שלוש.</p>
<p>מהסימטריה נובע: Φ(−z) = 1 − Φ(z). בנוסף, סכום של משתנים נורמליים הוא משתנה נורמלי.</p>
<h4>"באיזה טווח נמצאת התצפית בהסתברות של 95%?"</h4>
<p>עבור תצפית בודדת, ולא עבור ממוצע, הטווח הוא: μ ± 1.96σ. כך בשאלה 4 במבחן 09/2025: 4.2 ± 1.96·0.35, כלומר בין 3.51 ל־4.89 מטר.</p>
<h4>יישום במימון: ערך בסיכון (VaR)</h4>
<p>אם התשואה מתפלגת נורמלית, התשואה שמתחתיה נמצאים 5% מהמקרים היא: μ − 1.645σ. ברמה של 1%: μ − 2.33σ.</p>
<div class="ex"><b>דוגמה פתורה.</b> התשואה השנתית מתפלגת נורמלית עם ממוצע 8% וסטיית תקן 20%. מה ההסתברות להפסד?<br>
<span class="fx">Z = (0 − 8)/20 = −0.4</span><br><span class="fx">P(Z &lt; −0.4) = 1 − Φ(0.4) = 1 − 0.6554 = 0.3446</span>, כלומר כ־34.5%.<br>
ה־VaR ברמה של 5%: 8 − 1.645·20 = −24.9%.</div>
<div class="plain"><b>במילים פשוטות:</b> Z אומר כמה סטיות תקן התצפית רחוקה מהממוצע. ברגע שחישבת את Z, נשאר רק לשרטט ולקרוא בטבלה.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>בשאלה "גדול מ־" צריך 1 − Φ(z) ולא Φ(z). כדאי תמיד לשרטט פעמון ולסמן את השטח המבוקש.</li>
<li>לחלק בשונות במקום בסטיית התקן.</li>
<li>לבלבל בין 1.645 (חד־צדדי, 5%) לבין 1.96 (דו־צדדי, 5%).</li>
</ul></div>`},

{id:'s5', area:'stat', title:'דגימה ורווחי סמך', short:'רווחי סמך',
lesson:`
<p>אי אפשר לבדוק את כל האוכלוסייה, ולכן לוקחים מדגם ומסיקים ממנו על האוכלוסייה. ממוצע המדגם x̄ הוא בעצמו משתנה מקרי.</p>
<h4>משפט הגבול המרכזי</h4>
<p>כשהמדגם גדול (בדרך כלל n ≥ 30), ההתפלגות של x̄ קרובה לנורמלית, <u>בלי קשר</u> להתפלגות האוכלוסייה. התוחלת שלה היא μ, וסטיית התקן שלה נקראת טעות התקן:</p>
<div class="fx" dir="ltr">SE = σ / √n</div>
<h4>רווח סמך לממוצע</h4>
<div class="fx" dir="ltr">x̄ ± z<sub>α/2</sub>·σ/√n<br>σ unknown, small sample: x̄ ± t<sub>(n−1)</sub>·s/√n<br>n = (z·σ / E)²  &nbsp;(round up)</div>
<p>E הוא מחצית רוחב הרווח, והוא נקרא גם טעות הדגימה המרבית. רוחב הרווח פרופורציוני ל־1/√n, ולכן כדי לחצות את הרוחב צריך פי <b>4</b> תצפיות. ככל שרמת הביטחון גבוהה יותר, הרווח <b>רחב</b> יותר.</p>
<div class="ex"><b>דוגמה פתורה.</b> n = 100, x̄ = 50, σ = 10, רמת ביטחון 95%.<br>
SE = 10/√100 = 1. הרווח: 50 ± 1.96·1, כלומר [48.04 , 51.96].<br>
כמה תצפיות נדרשות כדי שטעות הדגימה המרבית תהיה 0.5? n = (1.96·10/0.5)² = 1536.64, ולכן מעגלים ל־1537.</div>
<div class="plain"><b>במילים פשוטות:</b> רווח סמך של 95% פירושו: אם נחזור על הדגימה פעמים רבות, 95% מהרווחים שנבנה יכילו את הממוצע האמיתי. אין זה אומר ש־μ "זז" בתוך הרווח. μ קבוע, והרווח הוא שמשתנה ממדגם למדגם.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להשתמש ב־σ במקום בטעות התקן σ/√n.</li>
<li>לחשוב שהכפלת המדגם מחצה את רוחב הרווח. בפועל הרוחב קטן רק פי √2.</li>
<li>לעגל כלפי מטה בחישוב גודל המדגם. תמיד מעגלים כלפי מעלה.</li>
</ul></div>`},

{id:'s6', area:'stat', title:'בדיקת השערות', short:'השערות',
lesson:`
<p>בדיקת השערות היא החלטה על סמך מדגם: האם יש מספיק ראיות כדי לדחות את טענת הבסיס.</p>
<ul><li><b>H₀</b> (השערת האפס): הטענה הקיימת, למשל μ = 100.</li><li><b>H₁</b> (ההשערה החלופית): הטענה שרוצים להוכיח, למשל μ ≠ 100 (דו־צדדית) או μ &gt; 100 (חד־צדדית).</li></ul>
<div class="fx" dir="ltr">Z = (x̄ − μ₀) / (σ/√n)</div>
<h4>שני סוגי טעויות</h4>
<div class="tbl-wrap"><table class="mini"><tr><th></th><th>H₀ נכונה</th><th>H₀ אינה נכונה</th></tr>
<tr><th>דוחים את H₀</th><td>טעות מסוג I (α)</td><td>החלטה נכונה (עוצמה = 1−β)</td></tr>
<tr><th>לא דוחים</th><td>החלטה נכונה</td><td>טעות מסוג II (β)</td></tr></table></div>
<ul><li>הקטנת α, כשגודל המדגם קבוע, מגדילה את β.</li><li>הגדלת המדגם מקטינה את β, ולכן מגדילה את עוצמת המבחן.</li></ul>
<h4>p-value</h4>
<p>ה־p-value הוא ההסתברות לקבל תוצאה קיצונית לפחות כמו זו שהתקבלה במדגם, בהנחה ש־H₀ נכונה. <b>דוחים את H₀ כאשר p-value &lt; α.</b></p>
<p>ערכים קריטיים: דו־צדדי ברמה 5%: 1.96. חד־צדדי ברמה 5%: 1.645. דו־צדדי ברמה 1%: 2.576. חד־צדדי ברמה 1%: 2.33.</p>
<div class="ex"><b>דוגמה פתורה.</b> H₀: μ = 100 מול H₁: μ ≠ 100. σ = 12, n = 36, x̄ = 103, α = 5%.<br>
SE = 12/6 = 2. Z = 3/2 = 1.5. מאחר ש־1.5 &lt; 1.96, לא דוחים את H₀.<br>
עם אותם נתונים והשערה חלופית H₁: μ &gt; 100, הערך הקריטי הוא 1.645, ו־1.5 עדיין קטן ממנו. גם כאן לא דוחים.</div>
<div class="plain"><b>במילים פשוטות:</b> זה כמו במשפט פלילי. H₀ היא חזקת החפות: הנאשם זכאי עד שתוכח אשמתו. "לא דוחים" אין פירושו "הוכחנו שהוא זכאי", אלא רק "אין מספיק ראיות להרשעה".</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לכתוב "מקבלים את H₀". הניסוח הנכון: "לא דוחים את H₀".</li>
<li>להפוך את כלל ה־p-value. דוחים כשהוא <u>קטן</u> מ־α.</li>
<li>להשתמש בערך קריטי דו־צדדי במבחן חד־צדדי.</li>
</ul></div>`},

{id:'s7', area:'stat', title:'מתאם ורגרסיה', short:'רגרסיה',
lesson:`
<p>מקדם המתאם r מודד את העוצמה ואת הכיוון של קשר <u>לינארי</u> בין שני משתנים, וערכו נע ממינוס 1 ועד 1. רגרסיה לינארית מוצאת את הקו שמתאר את הקשר בצורה הטובה ביותר.</p>
<div class="fx" dir="ltr">Ŷ = a + bX<br>b = Cov(X,Y) / V(X) = r·σ<sub>Y</sub>/σ<sub>X</sub><br>a = ȳ − b·x̄<br>R² = r² &nbsp;(simple regression)</div>
<div class="fx" dir="ltr">explained variance: B²·Var(X) = R²·Var(Y) = σ<sub>Y</sub>²·ρ²<br>unexplained: Var(ε) = (1 − R²)·Var(Y)</div>
<p>השיפוע b מראה בכמה משתנה Y, בממוצע, כאשר X עולה ביחידה אחת. מקדם הקביעה R² הוא החלק משונות Y שהמודל מסביר.</p>
<p>קו הרגרסיה עובר תמיד דרך נקודת הממוצעים (x̄, ȳ). שינוי יחידות המידה (הכפלה בקבוע חיובי) אינו משנה את r.</p>
<h4>הקשר למימון</h4>
<p>הבטא של מניה היא השיפוע ברגרסיה של תשואת המניה על תשואת השוק: β = Cov(R<sub>i</sub>,R<sub>m</sub>)/σ²<sub>m</sub>.</p>
<div class="ex"><b>דוגמה פתורה.</b> Cov(X,Y) = 12, V(X) = 4, x̄ = 2, ȳ = 10.<br>
b = 12/4 = 3. a = 10 − 3·2 = 4. קו הרגרסיה: Ŷ = 4 + 3X. עבור X = 5: Ŷ = 19.<br>
אם σ<sub>Y</sub> = 8, אז r = 12/(2·8) = 0.75 ו־R² = 0.5625.</div>
<div class="plain"><b>במילים פשוטות:</b> מתאם גבוה פירושו שהמשתנים "זזים יחד", אבל לא שאחד מהם גורם לשני. מכירות גלידה ומקרי טביעה מתואמים, כי שניהם עולים בקיץ.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחלק את השונות המשותפת בשונות של Y במקום בשונות של X.</li>
<li>לחשוב שמתאם 0 פירושו שאין שום קשר. ייתכן קשר שאינו לינארי.</li>
<li>להסיק סיבתיות ממתאם.</li>
</ul></div>`},

{id:'f1', area:'fin', title:'ערך הזמן של הכסף', short:'ערך הזמן',
lesson:`
<p>שקל היום שווה יותר משקל בעתיד, כי אפשר להשקיע אותו ולקבל עליו ריבית. לכן אי אפשר לחבר סכומים מתאריכים שונים לפני שמביאים את כולם לאותה נקודת זמן.</p>
<div class="fx" dir="ltr">FV = PV·(1 + r)<sup>n</sup> &nbsp;(compound)<br>PV = FV / (1 + r)<sup>n</sup><br>FV = PV·(1 + r·n) &nbsp;(simple)<br>r = (FV/PV)<sup>1/n</sup> − 1</div>
<p>בריבית דריבית מקבלים ריבית גם על הריבית שכבר נצברה. בריבית פשוטה מקבלים ריבית רק על הקרן. לתקופה של יותר משנה, ריבית דריבית מניבה תמיד יותר.</p>
<p>כלל 72: מספר השנים עד שהכסף מוכפל שווה בקירוב ל־72 חלקי הריבית באחוזים. זהו קירוב בלבד.</p>
<div class="ex"><b>דוגמה פתורה.</b> מפקידים 10,000 ₪ בריבית של 5% לשנה למשך 3 שנים.<br>
FV = 10,000·1.05³ = 11,576.25 ₪. בריבית פשוטה: 10,000·1.15 = 11,500 ₪.<br>
מה הערך הנוכחי של 20,000 ₪ שיתקבלו בעוד 4 שנים, בריבית של 6%? 20,000/1.06⁴ = 15,841.87 ₪.</div>
<div class="plain"><b>במילים פשוטות:</b> FV הוא תנועה "קדימה בזמן": מכפילים ב־(1+r) על כל שנה. PV הוא תנועה "אחורה בזמן": מחלקים. זה כל הסוד.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להשתמש בריבית שנתית עם מספר תקופות חודשי. הריבית ומספר התקופות חייבים להיות באותה יחידת זמן.</li>
<li>לחלק ב־(1 + r·n) כשנדרשת ריבית דריבית.</li>
</ul></div>`},

{id:'f2', area:'fin', title:'ריבית נקובה, אפקטיבית וריאלית', short:'ריביות',
lesson:`
<h4>ריבית נקובה מול ריבית אפקטיבית</h4>
<p>ריבית נקובה של 12% לשנה בצבירה חודשית פירושה 1% לחודש. בגלל הריבית דריבית, הריבית השנתית האפקטיבית גבוהה מ־12%.</p>
<div class="fx" dir="ltr">r<sub>eff</sub> = (1 + r/m)<sup>m</sup> − 1<br>continuous: r<sub>eff</sub> = e<sup>r</sup> − 1<br>monthly from annual effective: (1 + r)<sup>1/12</sup> − 1</div>
<p>ככל שמספר תקופות הצבירה בשנה (m) גדול יותר, הריבית האפקטיבית גבוהה יותר. הגבול העליון הוא צבירה רציפה.</p>
<h4>ריבית משתנה וריבית ממוצעת</h4>
<div class="fx" dir="ltr">i<sub>cum</sub> = (1 + i₁)(1 + i₂)…(1 + i<sub>t</sub>) − 1<br>i<sub>avg</sub> = (1 + i<sub>cum</sub>)<sup>1/t</sup> − 1</div>
<p>הריבית הממוצעת לתקופה היא ממוצע <b>גיאומטרי</b> ולא ממוצע חשבוני. כשהתשואות תנודתיות, הממוצע הגיאומטרי נמוך מהחשבוני. בשאלה 19 במבחן 09/2025, למשל, הממוצע החשבוני של 12 התשואות החודשיות הוא 0.39%, אבל התשואה החודשית האפקטיבית היא רק 0.23%.</p>
<h4>השוואה בין חלופות חיסכון</h4>
<p>כדי להשוות ריביות שמוצגות בצורות שונות (מצטברת, חודשית, יומית, רבעונית או לתקופה של 6 שנים), ממירים את כולן לאותה תקופה. דרך נוחה היא לחשב לכל חלופה את גורם הצבירה לכל התקופה: (1 + i)<sup>t</sup>. לדוגמה, ריבית של 5.1% בצבירה רבעונית ל־18 שנה: (1 + 0.051/4)<sup>72</sup> = 2.49.</p>
<h4>ריבית ריאלית: משוואת פישר</h4>
<div class="fx" dir="ltr">(1 + n) = (1 + r)·(1 + π)<br>r = (1 + n)/(1 + π) − 1 ≈ n − π</div>
<p>בנוסחה, n היא הריבית הנומינלית, r היא הריבית הריאלית ו־π היא שיעור האינפלציה. הריבית הריאלית מודדת את הגידול בכוח הקנייה.</p>
<h4>הצמדת הקרן למדד</h4>
<div class="fx" dir="ltr">linked principal = principal × (known index / base index)</div>
<h4>אג"ח צמודה מול אג"ח שקלית</h4>
<p>אג"ח צמודה למדד מניבה תשואה ריאלית, ואג"ח שקלית מניבה תשואה נומינלית. <b>אינפלציית האיזון</b> היא שיעור האינפלציה שבו שתיהן מניבות אותה תשואה: (1 + n<sub>שקלי</sub>)/(1 + r<sub>צמוד</sub>) − 1. משקיע שצופה אינפלציה גבוהה מאינפלציית האיזון יעדיף את האג"ח הצמודה.</p>
<div class="ex"><b>דוגמה פתורה.</b> ריבית נקובה של 12% בצבירה חודשית: (1.01)¹² − 1 = 12.68%.<br>
ריבית נומינלית 6% ואינפלציה 2%: r = 1.06/1.02 − 1 = 3.92%. הקירוב נותן 4%.<br>
אג"ח שקלית 4%, אג"ח צמודה 1.5%: אינפלציית האיזון = 1.04/1.015 − 1 = 2.46%.</div>
<div class="plain"><b>במילים פשוטות:</b> הבנק מציין ריבית של 12%, אבל אם הריבית נצברת כל חודש, בסוף השנה הרווחת קצת יותר. ואם המחירים עלו ב־2%, החלק מהרווח שבאמת מגדיל את כוח הקנייה שלך קטן יותר.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחשב n − π כשהשאלה מבקשת חישוב מדויק.</li>
<li>להמיר ריבית שנתית אפקטיבית לריבית חודשית בחלוקה ב־12. במקרה כזה צריך להוציא שורש 12.</li>
</ul></div>`},

{id:'f3', area:'fin', title:'סדרות תשלומים והלוואות', short:'סדרות והלוואות',
lesson:`
<p>סדרת תשלומים (אנונה) היא תשלום קבוע C בכל תקופה, לאורך n תקופות. במקום להוון כל תשלום בנפרד, משתמשים בנוסחה:</p>
<div class="fx" dir="ltr">PV = C·[1 − (1 + r)<sup>−n</sup>] / r<br>FV = C·[(1 + r)<sup>n</sup> − 1] / r<br>annuity due (start of period): × (1 + r)<br>perpetuity: PV = C / r<br>growing perpetuity: PV = C₁ / (r − g)</div>
<p>בצמיתות גדלה, C₁ הוא התשלום ב<u>סוף השנה הראשונה</u>, והנוסחה תקפה רק כאשר r &gt; g.</p>
<h4>סדרה סופית גדלה</h4>
<div class="fx" dir="ltr">PV = C₁/(r − g) · [1 − ((1 + g)/(1 + r))<sup>n</sup>]</div>
<p>הנוסחה הזו <u>אינה</u> מופיעה בדף הנוסחאות הרשמי. כשיש מעט תשלומים, הכי בטוח להוון כל תשלום בנפרד. בשאלה 11 במבחן 09/2025 היו 5 תשלומים חודשיים שגדלים ב־0.2%, והיה צריך גם להמיר ריבית שנתית אפקטיבית לריבית חודשית: (1.0407)<sup>1/12</sup> − 1 = 0.333%. כל תשלום מהוון לפי מספר החודשים עד מועד התשלום: 1, 2, 3, 4, 5.</p>
<h4>לוח שפיצר מול לוח קרן שווה</h4>
<div class="tbl-wrap"><table class="mini"><tr><th></th><th>שפיצר</th><th>קרן שווה</th></tr>
<tr><th>התשלום התקופתי</th><td>קבוע</td><td>יורד לאורך הזמן</td></tr>
<tr><th>התשלום הראשון</th><td>נמוך יותר</td><td>גבוה יותר</td></tr>
<tr><th>החזר הקרן בכל תשלום</th><td>עולה לאורך הזמן</td><td>קבוע: L/n</td></tr>
<tr><th>סך הריבית</th><td>גבוה יותר</td><td>נמוך יותר</td></tr></table></div>
<div class="fx" dir="ltr">Spitzer payment: PMT = L·r / [1 − (1 + r)<sup>−n</sup>]</div>
<div class="ex"><b>דוגמה פתורה.</b> הלוואה של 100,000 ₪ ל־5 שנים בריבית שנתית של 6%, בתשלומים שנתיים לפי לוח שפיצר.<br>
PMT = 100,000·0.06 / (1 − 1.06⁻⁵) = 6,000 / 0.25274 = 23,739.64 ₪.<br>
בשנה הראשונה: ריבית 6,000 והחזר קרן 17,739.64. יתרת הקרן: 82,260.36.<br>
בלוח קרן שווה: החזר קרן של 20,000 בכל שנה. התשלום הראשון 26,000 והאחרון 21,200.</div>
<div class="plain"><b>במילים פשוטות:</b> בשפיצר, בתחילת התקופה רוב התשלום הולך לריבית, ולכן הקרן יורדת לאט. בקרן שווה החוב קטן מהר יותר, ולכן סך הריבית נמוך יותר.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להשתמש בנוסחה לתשלומים בסוף התקופה כשהתשלומים בתחילתה.</li>
<li>להציב D₀ במקום D₁ בצמיתות גדלה.</li>
<li>לשכוח להמיר לריבית חודשית בהלוואה עם תשלומים חודשיים.</li>
</ul></div>`},

{id:'f4', area:'fin', title:'הערכת השקעות: NPV ו־IRR', short:'NPV ו־IRR',
lesson:`
<div class="fx" dir="ltr">NPV = PV − I<br>IRR: the rate where NPV = 0<br>PI = NPV / I &nbsp;(official formula sheet)<br>EAC = NPV·i / [1 − 1/(1 + i)<sup>t</sup>]</div>
<p><b>שימו לב:</b> בדף הנוסחאות הרשמי מדד הרווחיות מוגדר כ־NPV חלקי ההשקעה. לכן פרויקט כדאי כאשר PI &gt; 0, ולא כאשר PI &gt; 1 כמו בהגדרה הישנה (PV/I).</p>
<h4>תקציב מוגבל (קיצוב הון)</h4>
<p>כשהתקציב מוגבל ואפשר להשקיע גם בחלק מפרויקט, מדרגים את הפרויקטים לפי <b>PI</b>, כלומר לפי ה־NPV לכל שקל השקעה, וממלאים את התקציב מהגבוה לנמוך. ה־IRR אינו רלוונטי לדירוג. בשאלה 14 במבחן 09/2025: פרויקט B, עם PI של 1.2, נכנס ראשון (השקעה של 80 ₪ ו־NPV של 96). את 40 השקלים שנותרו משקיעים ב־C או ב־D (PI של 1.1) ומקבלים 44. סך הכול: 140.</p>
<h4>שווה ערך תקופתי (EAC)</h4>
<p>משמש להשוואה בין פרויקטים בעלי אורך חיים שונה: הופכים את ה־NPV של כל פרויקט לתשלום שנתי קבוע, ובוחרים בפרויקט שהתשלום שלו גבוה יותר.</p>
<ul>
<li><b>NPV &gt; 0</b>: הפרויקט מוסיף ערך מעבר לתשואה הנדרשת, ולכן מקבלים אותו.</li>
<li><b>IRR &gt; r</b>: מקבלים את הפרויקט. בפרויקט קונבנציונלי זה אותו כלל כמו NPV &gt; 0.</li>
<li>ככל שמחיר ההון עולה, ה־NPV של פרויקט קונבנציונלי יורד.</li>
</ul>
<h4>כאשר NPV ו־IRR סותרים</h4>
<p>בפרויקטים <b>מוציאים זה את זה</b> שני הכללים עלולים לדרג את הפרויקטים באופן שונה, בגלל הבדלים בהיקף ההשקעה או בעיתוי התזרימים. <b>במקרה כזה בוחרים תמיד לפי NPV</b>. הסיבה: IRR מניח השקעה מחדש של התזרימים בשיעור ה־IRR עצמו, ואילו NPV מניח השקעה מחדש במחיר ההון.</p>
<p>כשהתזרים מחליף סימן יותר מפעם אחת (פרויקט לא קונבנציונלי), ייתכנו כמה ערכי IRR, וייתכן גם שלא יהיה אף אחד.</p>
<h4>תקופת ההחזר</h4>
<p>תקופת ההחזר היא הזמן שעובר עד שההשקעה חוזרת. קל לחשב אותה, אבל היא מתעלמת מערך הזמן של הכסף ומהתזרימים שאחרי נקודת ההחזר.</p>
<div class="ex"><b>דוגמה פתורה.</b> השקעה של 1,000, ואחריה תקבול של 600 בכל אחת משתי השנים הבאות. מחיר ההון 10%.<br>
NPV = −1,000 + 600/1.1 + 600/1.21 = −1,000 + 545.45 + 495.87 = 41.32 ⇒ מקבלים את הפרויקט.<br>
IRR: פותרים 600x + 600x² = 1,000, כאשר x = 1/(1+i). מתקבל x = 0.8844, ולכן IRR ≈ 13.07% &gt; 10%.</div>
<div class="plain"><b>במילים פשוטות:</b> NPV עונה על השאלה: כמה כסף, בערכים של היום, הפרויקט מוסיף לי מעבר למה שהייתי מרוויח בהשקעה החלופית. IRR עונה על השאלה: איזו ריבית הפרויקט מניב לי.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לבחור לפי IRR בין פרויקטים מוציאים זה את זה.</li>
<li>להוון את ההשקעה הראשונית. היא מתבצעת בזמן 0.</li>
<li>לחשוב שתקופת החזר קצרה יותר עדיפה תמיד.</li>
</ul></div>`},

{id:'f5', area:'fin', title:'אגרות חוב, תשואה ומח"מ', short:'אג"ח ומח"מ',
lesson:`
<p>מחיר אג"ח הוא הערך הנוכחי של תשלומי הקופון ושל הקרן, מהוונים בתשואה לפדיון (YTM).</p>
<div class="fx" dir="ltr">P = Σ C/(1 + y)<sup>t</sup> + F/(1 + y)<sup>n</sup><br>zero coupon: P = F / (1 + y)<sup>n</sup><br>current yield = C / P</div>
<h4>כללים שחייבים לזכור</h4>
<ul>
<li>המחיר והתשואה נעים <b>בכיוונים הפוכים</b>.</li>
<li>קופון שווה לתשואה ⇒ האג"ח נסחרת לפי הערך הנקוב. תשואה &gt; קופון ⇒ נסחרת בניכיון (מחיר &lt; 100). תשואה &lt; קופון ⇒ נסחרת בפרמיה.</li>
</ul>
<h4>מח"מ (משך חיים ממוצע)</h4>
<div class="fx" dir="ltr">D (Macaulay) = Σ t·PV(CF<sub>t</sub>) / P<br>D* (modified) = D / (1 + y)<br>ΔP/P ≈ −D*·Δy (+ ½·Convexity·Δy²)<br>perpetual bond: D = (1 + y)/y</div>
<p>המח"מ הוא הממוצע המשוקלל של מועדי התשלומים, והוא משמש גם מדד לרגישות המחיר לשינויים בריבית. באג"ח ללא קופון המח"מ שווה לזמן לפדיון.</p>
<p>המח"מ <b>ארוך יותר</b> כאשר: התקופה לפדיון ארוכה יותר, הקופון נמוך יותר או התשואה נמוכה יותר.</p>
<p><b>קמירות</b>: עקומת המחיר־תשואה קמורה, ולכן הקירוב הלינארי של המח"מ <u>מעריך בחסר</u> את עליית המחיר כשהריבית יורדת, ו<u>מעריך ביתר</u> את ירידת המחיר כשהריבית עולה. מבין שתי אג"ח עם אותו מח"מ, עדיפה זו שהקמירות שלה גבוהה יותר.</p>
<div class="ex"><b>דוגמה פתורה.</b> אג"ח ל־3 שנים, קופון 5%, ערך נקוב 100, תשואה לפדיון 6%.<br>
P = 5/1.06 + 5/1.06² + 105/1.06³ = 4.717 + 4.450 + 88.160 = 97.33. האג"ח נסחרת בניכיון, כצפוי.<br>
D = (1·4.717 + 2·4.450 + 3·88.160)/97.33 = 2.857 שנים. D* = 2.857/1.06 = 2.696.<br>
עלייה של 1% בתשואה ⇒ ירידה של כ־2.70% במחיר.</div>
<div class="plain"><b>במילים פשוטות:</b> אג"ח ארוכה דומה לנדנדה ארוכה: כל שינוי קטן בריבית מזיז אותה בחוזקה. המח"מ המתואם אומר בכמה אחוזים, בקירוב, ישתנה המחיר על כל שינוי של 1% בריבית.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לשכוח את הסימן השלילי: ריבית עולה ⇒ מחיר יורד.</li>
<li>להשתמש במח"מ של מקולי במקום במח"מ המתואם בחישוב שינוי המחיר.</li>
<li>לחשוב שהתשואה השוטפת שווה לתשואה לפדיון.</li>
</ul></div>`},

{id:'f6', area:'fin', title:'המבנה העתי של הריבית', short:'מבנה עתי',
lesson:`
<p>ריבית ספוט s<sub>t</sub> היא הריבית השנתית על השקעה מהיום ועד שנה t. ריבית פורוורד f היא ריבית שנקבעת היום לתקופה עתידית.</p>
<div class="fx" dir="ltr">(1 + s₂)² = (1 + s₁)·(1 + f₁,₂)<br>f₁,₂ = (1 + s₂)² / (1 + s₁) − 1<br>general: (1 + s<sub>n</sub>)<sup>n</sup> = (1 + s<sub>m</sub>)<sup>m</sup>·(1 + f<sub>m,n</sub>)<sup>n−m</sup></div>
<h4>תאוריות שמסבירות את צורת עקום התשואות</h4>
<ul>
<li><b>השערת הציפיות הטהורות</b>: ריבית הפורוורד שווה לריבית הקצרה הצפויה. עקום עולה ⇒ השוק צופה עליית ריבית.</li>
<li><b>העדפת נזילות</b>: משקיעים דורשים פרמיה על השקעה לטווח ארוך, ולכן העקום נוטה לעלות גם בלי ציפייה לעליית ריבית.</li>
<li><b>שווקים מפוצלים</b>: לכל טווח יש היצע וביקוש משלו.</li>
</ul>
<p>עקום <b>הפוך</b>, שבו הריבית הקצרה גבוהה מהארוכה, נחשב פעמים רבות לסימן מקדים למיתון.</p>
<div class="ex"><b>דוגמה פתורה.</b> s₁ = 4%, s₂ = 5%.<br>
f₁,₂ = 1.05²/1.04 − 1 = 1.1025/1.04 − 1 = 6.01%. הקירוב 2·5% − 4% = 6% קרוב מאוד לתוצאה.</div>
<div class="plain"><b>במילים פשוטות:</b> השקעה לשנתיים צריכה להניב כמו השקעה לשנה אחת ואחריה השקעה לשנה נוספת. ריבית הפורוורד היא "הריבית של השנה השנייה" שמשווה בין שתי הדרכים.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לשכוח להעלות בריבוע את (1 + s₂).</li>
<li>לחשוב שעקום עולה מעיד תמיד על עליית ריבית צפויה. לפי תאוריית העדפת הנזילות, לא בהכרח.</li>
</ul></div>`},

{id:'f7', area:'fin', title:'הערכת מניות', short:'מניות',
lesson:`
<p>מחיר מניה הוא הערך הנוכחי של הדיבידנדים העתידיים. כשהדיבידנד צומח בקצב קבוע g, מתקבל <b>מודל גורדון</b>:</p>
<div class="fx" dir="ltr">P₀ = D₁ / (k − g) ,&nbsp; D₁ = D₀·(1 + g)<br>k = D₁/P₀ + g &nbsp;(dividend yield + growth)<br>g = b·ROE &nbsp;(b = retention ratio = 1 − payout)<br>P₀/E₁ = payout / (k − g)</div>
<p>המודל תקף רק כאשר k &gt; g. התשואה הנדרשת k מורכבת משני חלקים: תשואת הדיבידנד ושיעור הצמיחה.</p>
<h4>הערך הנוכחי של הזדמנויות הצמיחה (PVGO)</h4>
<div class="fx" dir="ltr">P₀ = E₁/k + PVGO</div>
<p>צמיחה יוצרת ערך רק כאשר ROE &gt; k. אם ROE = k, השקעה מחדש של הרווחים אינה משנה את מחיר המניה.</p>
<div class="ex"><b>דוגמה פתורה.</b> הדיבידנד ששולם זה עתה: D₀ = 2 ₪. g = 4%, k = 10%.<br>
D₁ = 2.08. P₀ = 2.08/(0.10 − 0.04) = 34.67 ₪.<br>
חברה עם ROE של 15% ושיעור חלוקה של 40%: g = 0.6·15% = 9%.</div>
<div class="plain"><b>במילים פשוטות:</b> המניה שווה את כל הדיבידנדים שהיא תחלק, בערכים של היום. ככל שהדיבידנדים צומחים מהר יותר, המכנה (k − g) קטן יותר והמחיר גבוה יותר.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>להציב D₀ במקום D₁. אם הדיבידנד שולם זה עתה, צריך להכפיל אותו ב־(1 + g).</li>
<li>לחשב את g לפי שיעור החלוקה. הנכון: ROE כפול שיעור <u>העיכוב</u>.</li>
</ul></div>`},

{id:'f8', area:'fin', title:'סיכון, תשואה ותורת התיקים', short:'תיקים',
lesson:`
<div class="fx" dir="ltr">E(R<sub>p</sub>) = Σ w<sub>i</sub>·E(R<sub>i</sub>)<br>σ²<sub>p</sub> = w₁²σ₁² + w₂²σ₂² + 2w₁w₂·ρ·σ₁σ₂<br>min variance: w₁ = (σ₂² − Cov) / (σ₁² + σ₂² − 2Cov)<br>Sharpe = (E(R) − r<sub>f</sub>) / σ</div>
<h4>תועלת הפיזור</h4>
<ul>
<li>ρ = 1: אין תועלת מפיזור. סטיית התקן של התיק היא הממוצע המשוקלל של סטיות התקן.</li>
<li>ρ &lt; 1: סטיית התקן של התיק <b>נמוכה</b> מהממוצע המשוקלל. זו תועלת הפיזור.</li>
<li>ρ = −1: אפשר לבנות תיק חסר סיכון. משקל הנכס הראשון בתיק כזה: w₁ = σ₂/(σ₁ + σ₂).</li>
</ul>
<p>הפיזור מבטל רק את הסיכון ה<b>ספציפי</b> (הלא־שיטתי). הסיכון ה<b>שיטתי</b>, כלומר סיכון השוק, נשאר.</p>
<h4>החזית היעילה וקו שוק ההון (CML)</h4>
<p>תיק יעיל הוא תיק שאין תיק אחר שמניב תשואה צפויה גבוהה יותר באותה רמת סיכון. כשמוסיפים נכס חסר סיכון, כל התיקים היעילים נמצאים על קו ישר שיוצא מ־r<sub>f</sub> ועובר דרך תיק השוק:</p>
<div class="fx" dir="ltr">E(R<sub>p</sub>) = r<sub>f</sub> + [(E(R<sub>m</sub>) − r<sub>f</sub>) / σ<sub>m</sub>]·σ<sub>p</sub><br>risk-free + risky mix: σ<sub>p</sub> = w·σ<sub>risky</sub></div>
<h4>סוגי שאלות שחוזרים במבחן</h4>
<ul><li><b>תיק עם נכס חסר סיכון ויעד לסטיית התקן</b>: σ<sub>total</sub> = w<sub>risky</sub>·σ<sub>risky</sub>. אם סטיית התקן של התיק המנייתי היא 18% ורוצים להגיע ל־9%, משקיעים 50% בנכס חסר הסיכון (שאלה 1 במבחן 09/2025).</li>
<li><b>תיק מינימום שונות</b>: המשקל של A לפי הנוסחה בדף הרשמי הוא W<sub>A</sub>* = (σ<sub>B</sub>² − σ<sub>A</sub>σ<sub>B</sub>ρ)/(σ<sub>A</sub>² + σ<sub>B</sub>² − 2σ<sub>A</sub>σ<sub>B</sub>ρ). השאלה יכולה להופיע גם בכיוון ההפוך: נתונה סטיית התקן של תיק המינימום, ומבקשים את ρ (שאלה 20). במקרה כזה פותרים בניסוי וטעייה, על ידי הצבת התשובות.</li>
<li>המתאם שמביא לסיכון <b>המינימלי</b> הוא ‎−1 (שאלה 6).</li></ul>
<div class="ex"><b>דוגמה פתורה.</b> 60% בנכס A (תשואה צפויה 10%, סטיית תקן 20%) ו־40% בנכס B (תשואה צפויה 14%, סטיית תקן 30%), ρ = 0.2.<br>
E = 0.6·10 + 0.4·14 = 11.6%.<br>
σ² = 0.36·0.04 + 0.16·0.09 + 2·0.6·0.4·0.2·0.2·0.3 = 0.0144 + 0.0144 + 0.00576 = 0.03456, ולכן σ = 18.59%.<br>
הממוצע המשוקלל של סטיות התקן הוא 24%, כך שהפיזור הוריד את סטיית התקן בכ־5.4 נקודות אחוז.</div>
<div class="plain"><b>במילים פשוטות:</b> אל תשים את כל הביצים בסל אחד. כשנכס אחד יורד והשני לא בהכרח יורד איתו, התיק כולו תנודתי פחות.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לחשב ממוצע משוקלל של סטיות התקן כשהמתאם קטן מ־1.</li>
<li>לשכוח את המקדם 2 באיבר של השונות המשותפת.</li>
<li>לחשוב שפיזור מבטל את כל הסיכון.</li>
</ul></div>`},

{id:'f9', area:'fin', title:'CAPM, בטא ומדדי ביצוע', short:'CAPM',
lesson:`
<p>לפי מודל CAPM, השוק מתגמל רק על סיכון שיטתי, והסיכון הזה נמדד בבטא.</p>
<div class="fx" dir="ltr">E(R<sub>i</sub>) = r<sub>f</sub> + β<sub>i</sub>·[E(R<sub>m</sub>) − r<sub>f</sub>]<br>β<sub>i</sub> = Cov(R<sub>i</sub>,R<sub>m</sub>) / σ²<sub>m</sub> = ρ<sub>im</sub>·σ<sub>i</sub>/σ<sub>m</sub><br>β<sub>p</sub> = Σ w<sub>i</sub>·β<sub>i</sub><br>σ²<sub>i</sub> = β²σ²<sub>m</sub> + σ²<sub>e</sub> &nbsp;(systematic + specific)</div>
<p>הבטא של תיק השוק היא 1, והבטא של נכס חסר סיכון היא 0. הקו שמתאר את התשואה הצפויה כפונקציה של β נקרא <b>קו שוק ניירות הערך (SML)</b>. קו שוק ההון (CML) משתמש ב־σ ומתאים רק לתיקים יעילים, ואילו ה־SML מתאים לכל נכס.</p>
<h4>CML מול SML: מה נכון ומה לא</h4>
<ul>
<li>כל תיק על ה־CML הוא שילוב של תיק השוק M ושל הנכס חסר הסיכון. תיק שנמצא בין r<sub>f</sub> ל־M הוא תיק <b>מלווה</b>: חלק מהכסף מושקע בנכס חסר הסיכון. תיק שנמצא מעבר ל־M הוא תיק <b>לווה</b>, כלומר ממונף.</li>
<li>ה־CML מתמחר רק <b>תיקים יעילים</b>. נכס בודד מתומחר לפי ה־SML.</li>
<li>תיק שאין בו סיכון ספציפי הוא תיק יעיל, ולכן הוא נמצא גם על ה־CML וגם על ה־SML. סטיית התקן שלו: β·σ<sub>m</sub>.</li>
<li>תיק עם β = 1 יכול להימצא על ה־CML: זהו תיק השוק עצמו.</li>
<li>הטענה "הבטא של כל תיק יעיל היא 1" שגויה. לתיק יעיל יכולה להיות כל בטא. למשל, תיק שחציו מושקע בתיק השוק וחציו בנכס חסר סיכון: β = 0.5.</li>
<li>שינוי המחיר לפי הבטא (כאשר r<sub>f</sub> = 0): תשואת המניה שווה לבטא כפול תשואת השוק. ירידה של 2% בשוק ו־β = 1.6 ⇒ ‎−3.2%.</li>
</ul>
<h4>אלפא ותמחור</h4>
<p>אם התשואה הצפויה של מניה גבוהה מזו שנותן מודל CAPM, המניה נמצאת מעל ה־SML: היא <b>זולה</b> (אלפא חיובית), וכדאי לקנות אותה.</p>
<h4>מדדי ביצוע</h4>
<div class="fx" dir="ltr">Sharpe = (R<sub>p</sub> − r<sub>f</sub>) / σ<sub>p</sub><br>Treynor = (R<sub>p</sub> − r<sub>f</sub>) / β<sub>p</sub><br>Jensen α = R<sub>p</sub> − [r<sub>f</sub> + β<sub>p</sub>(R<sub>m</sub> − r<sub>f</sub>)]</div>
<p>שני המדדים הראשונים מודדים תשואה עודפת ליחידת סיכון. מדד שארפ מתאים כשהתיק הוא כל ההשקעה של המשקיע, ולכן הוא מתייחס לסיכון הכולל. מדד טריינור מתאים כשהתיק הוא חלק מתיק מפוזר, ולכן הוא מתייחס לסיכון השיטתי בלבד.</p>
<div class="ex"><b>דוגמה פתורה.</b> r<sub>f</sub> = 3%, תשואת השוק 9%, β = 1.2.<br>
E(R) = 3 + 1.2·6 = 10.2%. אנליסט צופה תשואה של 12% ⇒ α = 1.8% ⇒ המניה זולה.<br>
תיק: 40% במניה עם בטא 0.8 ו־60% במניה עם בטא 1.3 ⇒ β = 0.32 + 0.78 = 1.1.</div>
<div class="plain"><b>במילים פשוטות:</b> בטא של 1.5 פירושה שכאשר השוק עולה ב־1%, המניה עולה בממוצע ב־1.5%. על הסיכון הזה מקבלים פרמיה. על סיכון שאפשר להיפטר ממנו בפיזור לא מקבלים דבר.</div>
<div class="trap"><b>מלכודות נפוצות</b><ul>
<li>לכתוב r<sub>f</sub> + β·R<sub>m</sub>, כלומר לשכוח לחסר את r<sub>f</sub> מתשואת השוק.</li>
<li>לחלק את השונות המשותפת בסטיית התקן של השוק במקום בשונות שלו.</li>
<li>לבלבל בין CML, שמבוסס על σ, לבין SML, שמבוסס על β.</li>
</ul></div>`}

   tip:'תצפית על הממוצע "מדללת" את הפיזור: אותו סכום ריבועים מתחלק בין יותר תצפיות.'}),
 w:[null,
   'סכום ריבועי הסטיות אכן לא משתנה, אבל מחלקים אותו עכשיו במספר גדול יותר של תצפיות. לכן סטיית התקן קטנה ולא נשארת קבועה.',
   'הממוצע לא עולה. מוסיפים לסכום בדיוק את הממוצע ומוסיפים לספירה תצפית אחת, והיחס נשאר אותו דבר.',
   'סטיית התקן לא גדלה. התצפית החדשה מוסיפה סטייה של 0, כלומר היא קרובה לממוצע יותר מכל תצפית אחרת, ולכן היא מקטינה את הפיזור הממוצע.']}
],
s2:[
{q:'המאורעות A ו־B בלתי תלויים. נתון: P(A) = 0.5, P(B) = 0.4. מהי ההסתברות שיתרחש לפחות אחד מהם?', o:['0.7','0.9','0.2','0.6'],
 e:SOL({ask:'ההסתברות לאיחוד: ש־A יתרחש, או ש־B יתרחש, או ששניהם.',
   f:'<bdi dir="ltr">P(A∪B) = P(A) + P(B) − P(A∩B)</bdi>',
   why:'כשמחברים את P(A) ו־P(B), המקרים ששניהם קרו נספרים פעמיים, ולכן מחסירים את החיתוך פעם אחת. בגלל אי־התלות, החיתוך הוא מכפלת ההסתברויות.',
   steps:['החיתוך: <bdi dir="ltr">P(A∩B) = 0.5·0.4 = 0.2</bdi>', 'האיחוד: <bdi dir="ltr">0.5 + 0.4 − 0.2 = 0.7</bdi>'],
   res:'ההסתברות שיתרחש לפחות אחד מהם היא 0.7.',
   tip:'"לפחות אחד" = איחוד. אפשר גם דרך המשלים: <bdi dir="ltr">1 − 0.5·0.6 = 0.7</bdi>.'}),
 w:[null,
   '0.9 הוא <bdi dir="ltr">0.5 + 0.4</bdi> בלי להחסיר את החיתוך. כך המקרים ששני המאורעות קרו נספרים פעמיים.',
   '0.2 הוא החיתוך <bdi dir="ltr">P(A∩B)</bdi>, כלומר ההסתברות ששניהם יתרחשו. שואלים על "לפחות אחד", שזה האיחוד.',
   '0.6 הוא <bdi dir="ltr">1 − 0.4</bdi>, ההסתברות ש־B לא יתרחש. בדרך המשלים צריך להחסיר מ־1 את ההסתברות שאף אחד לא יתרחש: <bdi dir="ltr">1 − 0.5·0.6 = 0.7</bdi>.']},
{q:'המאורעות A ו־B זרים, ולשניהם הסתברות חיובית. איזו טענה נכונה?', o:['הם תלויים','הם בלתי תלויים','P(A∩B) = P(A)·P(B)','P(A|B) = P(A)'],
 e:SOL({ask:'האם מאורעות זרים (שלא יכולים לקרות יחד) יכולים להיות בלתי תלויים.',
   f:'<bdi dir="ltr">P(A|B) = P(A∩B) / P(B)</bdi>',
   why:'אי־תלות פירושה שהידיעה ש־B קרה לא משנה את הסיכוי של A. כשהמאורעות זרים, הידיעה ש־B קרה אומרת בוודאות ש־A לא קרה, כלומר היא משנה הכול.',
   steps:['זרים: <bdi dir="ltr">P(A∩B) = 0</bdi>', 'לכן <bdi dir="ltr">P(A|B) = 0/P(B) = 0</bdi>', 'אבל <bdi dir="ltr">P(A) > 0</bdi>, ולכן <bdi dir="ltr">P(A|B) ≠ P(A)</bdi>'],
   res:'המאורעות תלויים.',
   tip:'זרים ובלתי תלויים הם כמעט הפכים: מאורעות זרים עם הסתברות חיובית תמיד תלויים.'}),
 w:[null,
   'הטענה מבלבלת בין "זרים" ל"בלתי תלויים". זרים פירושו שלא קורים יחד, ודווקא בגלל זה כל אחד מספק מידע על השני.',
   'בצד שמאל <bdi dir="ltr">P(A∩B) = 0</bdi>, כי המאורעות זרים. בצד ימין מכפלה של שני מספרים חיוביים, שאינה 0. השוויון לא מתקיים.',
   'כש־B התרחש, A בוודאות לא התרחש, ולכן <bdi dir="ltr">P(A|B) = 0</bdi>. זה שונה מ־<bdi dir="ltr">P(A) > 0</bdi>.']},
{q:'נתון: P(A|B) = 0.3, P(B) = 0.5. מהי ההסתברות ששני המאורעות יתרחשו יחד?', o:['0.15','0.6','0.8','0.2'],
 e:SOL({ask:'ההסתברות לחיתוך <bdi dir="ltr">P(A∩B)</bdi>, כשנתונה הסתברות מותנית.',
   f:'<bdi dir="ltr">P(A∩B) = P(A|B)·P(B)</bdi>',
   why:'כדי ששניהם יקרו, קודם B צריך לקרות (0.5), ואז, מתוך המקרים האלה, A צריך לקרות (0.3). זה כלל הכפל, שמתקבל מהגדרת ההסתברות המותנית.',
   steps:['מציבים: <bdi dir="ltr">P(A∩B) = 0.3·0.5</bdi>', 'מחשבים: <bdi dir="ltr">0.3·0.5 = 0.15</bdi>'],
   res:'ההסתברות ששניהם יתרחשו היא 0.15.',
   tip:'חיתוך = מותנית כפול ההסתברות של התנאי.'}),
 w:[null,
   '0.6 מתקבל מחלוקה: <bdi dir="ltr">0.3/0.5</bdi>. כאן צריך לכפול, כי החיתוך קטן מכל אחד מהגורמים.',
   '0.8 הוא <bdi dir="ltr">0.3 + 0.5</bdi>. חיבור מתאים לאיחוד, וגם אז צריך להחסיר את החיתוך. לחיתוך כופלים.',
   '0.2 הוא <bdi dir="ltr">0.5 − 0.3</bdi>. אין כאן הפרש. החיתוך הוא מכפלה: <bdi dir="ltr">0.3·0.5 = 0.15</bdi>.']},
{q:'בכמה דרכים אפשר לבחור 3 מניות מתוך 8 (הסדר לא חשוב)?', o:['56','336','24','512'],
 e:SOL({ask:'מספר הקבוצות בנות 3 מתוך 8, בלי חזרות וכשהסדר לא חשוב (צירופים).',
   f:'<bdi dir="ltr">C(n,k) = n! / (k!·(n − k)!)</bdi>',
   why:'אם הסדר היה חשוב, היו <bdi dir="ltr">8·7·6</bdi> אפשרויות. אבל כל קבוצה של 3 מניות נספרת שם <bdi dir="ltr">3! = 6</bdi> פעמים (בכל הסדרים שלה), ולכן מחלקים ב־6.',
   steps:['עם סדר: <bdi dir="ltr">8·7·6 = 336</bdi>', 'מחלקים במספר הסדרים של 3 מניות: <bdi dir="ltr">336/3! = 336/6 = 56</bdi>'],
   res:'יש 56 דרכים.',
   tip:'"הסדר לא חשוב" = מחלקים ב־k!.'}),
 w:[null,
   '336 הוא מספר האפשרויות כשהסדר חשוב (<bdi dir="ltr">8·7·6</bdi>). כאן הסדר לא חשוב, ולכן מחלקים עוד ב־<bdi dir="ltr">3! = 6</bdi>.',
   '24 הוא <bdi dir="ltr">8·3</bdi>. אין כאן כפל של מספר המניות במספר הבחירות. סופרים קבוצות: <bdi dir="ltr">C(8,3) = 56</bdi>.',
   '512 הוא <bdi dir="ltr">8³</bdi>, כלומר בחירה עם חזרות וכשהסדר חשוב. כאן אי אפשר לבחור אותה מניה פעמיים, והסדר לא חשוב.']},
{q:'ההסתברות שהשוק יהיה במצב רע היא 30%. במצב רע קרן מפסידה בהסתברות 0.8, ובמצב טוב בהסתברות 0.2. ידוע שהקרן הפסידה. מה ההסתברות שהשוק היה במצב רע?', o:['כ־63%','כ־24%','כ־38%','80%'],
 e:SOL({ask:'הסתברות "הפוכה": יודעים שהקרן הפסידה, ושואלים מה הסיכוי שהסיבה הייתה מצב שוק רע.',
   f:'<bdi dir="ltr">P(R|L) = P(R)·P(L|R) / P(L)</bdi>',
   why:'זו נוסחת בייס. מתוך כל המקרים שבהם הקרן הפסידה (המכנה), בודקים איזה חלק הגיע ממצב רע (המונה).',
   steps:['הפסד במצב רע: <bdi dir="ltr">0.3·0.8 = 0.24</bdi>', 'הפסד במצב טוב: <bdi dir="ltr">0.7·0.2 = 0.14</bdi>', 'ההסתברות הכוללת להפסד: <bdi dir="ltr">0.24 + 0.14 = 0.38</bdi>', 'בייס: <bdi dir="ltr">0.24/0.38 ≈ 0.632</bdi>'],
   res:'ההסתברות שהשוק היה במצב רע היא כ־63%.',
   tip:'בבייס המכנה הוא ההסתברות הכוללת של מה שידוע (ההפסד), מכל המצבים יחד.'}),
 w:[null,
   '24% היא ההסתברות ששני הדברים יקרו יחד (מצב רע וגם הפסד). ידוע שהיה הפסד, ולכן צריך לחלק בהסתברות להפסד: <bdi dir="ltr">0.24/0.38</bdi>.',
   '38% היא ההסתברות הכוללת להפסד. זה המכנה בנוסחת בייס, ולא התשובה.',
   '80% היא <bdi dir="ltr">P(L|R)</bdi>, הסיכוי להפסיד בהינתן מצב רע. שואלים על הכיוון ההפוך, <bdi dir="ltr">P(R|L)</bdi>, ולשם כך צריך את בייס.']},
{q:'מטילים שתי קוביות הוגנות. מה ההסתברות שסכומן 7?', o:['1/6','1/12','7/36','1/36'],
 e:SOL({ask:'כמה מתוך כל התוצאות האפשריות של שתי קוביות נותנות סכום 7.',

   steps:['כל התוצאות: <bdi dir="ltr">6·6 = 36</bdi>', 'סכום 7: <bdi dir="ltr">(1,6), (2,5), (3,4), (4,3), (5,2), (6,1)</bdi>, כלומר 6 תוצאות', 'ההסתברות: <bdi dir="ltr">6/36 = 1/6</bdi>'],
